name: Supabase Staging Schema Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-staging-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate database secrets and endpoint separation
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          for name in PRODUCTION_DATABASE_URL STAGING_DATABASE_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is not configured"
              exit 1
            fi
            case "$value" in
              postgres://*|postgresql://*) ;;
              *)
                echo "$name is not a PostgreSQL connection URL"
                exit 1
                ;;
            esac
          done

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, unquote

          def identity(value: str):
              parsed = urlparse(value)
              return (
                  parsed.hostname,
                  parsed.port or 5432,
                  unquote(parsed.username or ""),
                  parsed.path or "/postgres",
              )

          production = identity(os.environ["PRODUCTION_DATABASE_URL"])
          staging = identity(os.environ["STAGING_DATABASE_URL"])
          if production == staging:
              raise SystemExit("Production and staging resolve to the same database endpoint; refusing to continue")
          print("Database endpoint separation check: OK")
          PY

      - name: Dump production public schema only
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coffee-saas-staging-bootstrap"

          docker run --rm \
            -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            -v "$RUNNER_TEMP/coffee-saas-staging-bootstrap:/work" \
            postgres:17-alpine \
            sh -ec 'pg_dump --schema-only --schema=public --no-owner --dbname="$DATABASE_URL" --file=/work/production-public-schema.sql'

      - name: Verify dump contains schema only
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/coffee-saas-staging-bootstrap/production-public-schema.sql"
          test -s "$file"

          if grep -Eq '^(COPY|INSERT INTO) ' "$file"; then
            echo "Unexpected row-data statement found in schema-only dump"
            exit 1
          fi

          echo "Production schema dump size:"
          wc -c "$file"
          echo "Production schema dump SHA-256:"
          sha256sum "$file"

          echo "Production object counts from dump:"
          echo "tables=$(grep -Ec '^CREATE TABLE public\.' "$file" || true)"
          echo "functions=$(grep -Ec '^CREATE FUNCTION public\.' "$file" || true)"
          echo "policies=$(grep -Ec '^CREATE POLICY ' "$file" || true)"
          echo "triggers=$(grep -Ec '^CREATE TRIGGER ' "$file" || true)"

      - name: Preflight staging is empty for application tables
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          existing="$(docker run --rm \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            postgres:17-alpine \
            sh -ec 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from information_schema.tables where table_schema = ''public'' and table_name = any(array[''''shops'''',''''branch'''',''''shop_members'''',''''profiles'''',''''menu'''',''''menu_variants'''',''''menu_serve_types'''',''''ingredients'''',''''recipe_items'''',''''orders'''',''''order_items'''',''''stock_logs'''',''''pos_idempotency'''',''''daily_closes'''',''''cash_movements'''']);"')"

          if [ "$existing" != "0" ]; then
            echo "Staging already contains one or more application tables; refusing to restore over an existing schema"
            exit 1
          fi
          echo "Staging application-table preflight: empty"

      - name: Restore production schema to staging only
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -v "$RUNNER_TEMP/coffee-saas-staging-bootstrap:/work:ro" \
            postgres:17-alpine \
            sh -ec 'psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --single-transaction --file=/work/production-public-schema.sql'

      - name: Verify staging baseline and zero application rows
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            postgres:17-alpine \
            sh -ec 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'"'"'SQL'"'"'
          \set QUIET 1

          do $$
          declare
            object_name text;
            row_count bigint;
          begin
            foreach object_name in array array[
              '"'"'shops'"'"', '"'"'branch'"'"', '"'"'shop_members'"'"', '"'"'profiles'"'"', '"'"'menu'"'"',
              '"'"'menu_variants'"'"', '"'"'menu_serve_types'"'"', '"'"'ingredients'"'"', '"'"'recipe_items'"'"',
              '"'"'orders'"'"', '"'"'order_items'"'"', '"'"'stock_logs'"'"', '"'"'pos_idempotency'"'"',
              '"'"'daily_closes'"'"', '"'"'cash_movements'"'"'
            ] loop
              if to_regclass(format('"'"'public.%I'"'"', object_name)) is null then
                raise exception '"'"'Missing required staging table: %'"'"', object_name;
              end if;

              execute format('"'"'select count(*) from public.%I'"'"', object_name) into row_count;
              if row_count <> 0 then
                raise exception '"'"'Staging table % unexpectedly contains % rows'"'"', object_name, row_count;
              end if;
            end loop;
          end
          $$;

          do $$
          declare
            function_name text;
          begin
            foreach function_name in array array[
              '"'"'current_shop_id'"'"', '"'"'current_branch_id'"'"', '"'"'is_staff_in_current_shop'"'"',
              '"'"'is_owner_in_current_shop'"'"', '"'"'cancel_order'"'"'
            ] loop
              if not exists (
                select 1
                from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = '"'"'public'"'"'
                  and p.proname = function_name
              ) then
                raise exception '"'"'Missing required staging function: %'"'"', function_name;
              end if;
            end loop;
          end
          $$;

          \set QUIET 0
          select
            (select count(*) from information_schema.tables where table_schema = '"'"'public'"'"' and table_type = '"'"'BASE TABLE'"'"') as tables,
            (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = '"'"'public'"'"') as functions,
            (select count(*) from pg_policies where schemaname = '"'"'public'"'"') as policies,
            (select count(*) from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_namespace n on n.oid = c.relnamespace where n.nspname = '"'"'public'"'"' and not t.tgisinternal) as triggers,
            (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = '"'"'public'"'"' and c.relrowsecurity) as rls_enabled_relations;
          SQL'

      - name: Remove temporary production schema dump
        if: always()
        run: rm -rf "$RUNNER_TEMP/coffee-saas-staging-bootstrap"
