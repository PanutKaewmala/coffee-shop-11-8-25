name: Validate PR 32 atomic operations on staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VALIDATE_PR32_STAGING to confirm the staging-only migration and tests"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr32-staging-atomic-validation
  cancel-in-progress: false

jobs:
  validate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      EXPECTED_STAGING_HOST: aws-0-ap-southeast-2.pooler.supabase.com
      REJECTED_PRODUCTION_HOST: aws-1-ap-southeast-1.pooler.supabase.com
      MIGRATION: supabase/migrations/20260807090000_atomic_pos_checkout.sql
      TEST_PREFIX: pr32_atomic_validation
      SHOP_ID: 32000000-0000-4000-8000-000000000001
      BRANCH_ID: 32000000-0000-4000-8000-000000000002
      OTHER_BRANCH_ID: 32000000-0000-4000-8000-000000000003
      OWNER_ID: 32000000-0000-4000-8000-000000000004
      STAFF_ID: 32000000-0000-4000-8000-000000000005
      OUTSIDER_ID: 32000000-0000-4000-8000-000000000006
      CATEGORY_ID: 32000000-0000-4000-8000-000000000007
      SERVE_ID: 32000000-0000-4000-8000-000000000008
      MENU_ID: 32000000-0000-4000-8000-000000000009
      VARIANT_ID: 32000000-0000-4000-8000-00000000000a
      INGREDIENT_ID: 32000000-0000-4000-8000-00000000000b
      FOREIGN_INGREDIENT_ID: 32000000-0000-4000-8000-00000000000c
      # One canonical, transaction-safe cleanup program is used both before fixture
      # creation and by the always() teardown. Every predicate is tied to the
      # deterministic PR32 shop/object/user identities.
      PR32_FIXTURE_CLEANUP_SQL: |
        select set_config('pr32.shop', :'shop', false);
        select set_config('pr32.branch', :'branch', false);
        select set_config('pr32.other_branch', :'other_branch', false);
        select set_config('pr32.owner', :'owner', false);
        select set_config('pr32.staff', :'staff', false);
        select set_config('pr32.outsider', :'outsider', false);
        select set_config('pr32.category', :'category', false);
        select set_config('pr32.serve', :'serve', false);
        select set_config('pr32.menu', :'menu', false);
        select set_config('pr32.variant', :'variant', false);
        select set_config('pr32.ingredient', :'ingredient', false);
        select set_config('pr32.foreign_ingredient', :'foreign_ingredient', false);
        select set_config('pr32.close', :'close', false);
        select set_config('pr32.cash_close', :'cash_close', false);
        select set_config('pr32.cancel_close', :'cancel_close', false);
        select set_config('pr32.cancel_order', :'cancel_order', false);
        begin;
        alter table public.branch disable trigger trg_prevent_delete_last_branch;
        delete from public.stock_logs
          where shop_id=:'shop'
            or ingredient_id in (:'ingredient',:'foreign_ingredient')
            or order_id=:'cancel_order';
        delete from public.order_items where shop_id=:'shop';
        delete from public.orders where shop_id=:'shop' or id=:'cancel_order';
        delete from public.pos_idempotency where shop_id=:'shop';
        delete from public.cash_movements where shop_id=:'shop';
        delete from public.daily_closes
          where shop_id=:'shop' or id in (:'close',:'cash_close',:'cancel_close');
        delete from public.recipe_items
          where shop_id=:'shop' or ingredient_id in (:'ingredient',:'foreign_ingredient') or variant_id=:'variant';
        delete from public.ingredients
          where shop_id=:'shop' or id in (:'ingredient',:'foreign_ingredient');
        delete from public.menu_variants where shop_id=:'shop' or id=:'variant';
        delete from public.menu where shop_id=:'shop' or id=:'menu';
        delete from public.menu_serve_types where shop_id=:'shop' or id=:'serve';
        delete from public.menu_categories where shop_id=:'shop' or id=:'category';
        delete from public.shop_members
          where shop_id=:'shop' or user_id in (:'owner',:'staff',:'outsider');
        delete from public.branch
          where shop_id=:'shop' or id in (:'branch',:'other_branch');
        delete from public.shops where id=:'shop';
        delete from auth.users where id in (:'owner',:'staff',:'outsider');
        alter table public.branch enable trigger trg_prevent_delete_last_branch;
        commit;
        do $cleanup_verification$
        declare
          failures text[] := array[]::text[];
        begin
          if (select count(*) from public.shops where id=current_setting('pr32.shop')::uuid) <> 0 then failures := array_append(failures,'shops'); end if;
          if (select count(*) from public.branch where shop_id=current_setting('pr32.shop')::uuid or id in (current_setting('pr32.branch')::uuid,current_setting('pr32.other_branch')::uuid)) <> 0 then failures := array_append(failures,'branch'); end if;
          if (select count(*) from public.shop_members where shop_id=current_setting('pr32.shop')::uuid or user_id in (current_setting('pr32.owner')::uuid,current_setting('pr32.staff')::uuid,current_setting('pr32.outsider')::uuid)) <> 0 then failures := array_append(failures,'shop_members'); end if;
          if (select count(*) from auth.users where id in (current_setting('pr32.owner')::uuid,current_setting('pr32.staff')::uuid,current_setting('pr32.outsider')::uuid)) <> 0 then failures := array_append(failures,'auth.users'); end if;
          if (select count(*) from public.orders where shop_id=current_setting('pr32.shop')::uuid or id=current_setting('pr32.cancel_order')::uuid) <> 0 then failures := array_append(failures,'orders'); end if;
          if (select count(*) from public.order_items where shop_id=current_setting('pr32.shop')::uuid) <> 0 then failures := array_append(failures,'order_items'); end if;
          if (select count(*) from public.stock_logs where shop_id=current_setting('pr32.shop')::uuid or ingredient_id in (current_setting('pr32.ingredient')::uuid,current_setting('pr32.foreign_ingredient')::uuid) or order_id=current_setting('pr32.cancel_order')::uuid) <> 0 then failures := array_append(failures,'stock_logs'); end if;
          if (select count(*) from public.pos_idempotency where shop_id=current_setting('pr32.shop')::uuid) <> 0 then failures := array_append(failures,'pos_idempotency'); end if;
          if (select count(*) from public.cash_movements where shop_id=current_setting('pr32.shop')::uuid) <> 0 then failures := array_append(failures,'cash_movements'); end if;
          if (select count(*) from public.daily_closes where shop_id=current_setting('pr32.shop')::uuid or id in (current_setting('pr32.close')::uuid,current_setting('pr32.cash_close')::uuid,current_setting('pr32.cancel_close')::uuid)) <> 0 then failures := array_append(failures,'daily_closes'); end if;
          if (select count(*) from public.recipe_items where shop_id=current_setting('pr32.shop')::uuid or ingredient_id in (current_setting('pr32.ingredient')::uuid,current_setting('pr32.foreign_ingredient')::uuid) or variant_id=current_setting('pr32.variant')::uuid) <> 0 then failures := array_append(failures,'recipe_items'); end if;
          if (select count(*) from public.ingredients where shop_id=current_setting('pr32.shop')::uuid or id in (current_setting('pr32.ingredient')::uuid,current_setting('pr32.foreign_ingredient')::uuid)) <> 0 then failures := array_append(failures,'ingredients'); end if;
          if (select count(*) from public.menu_variants where shop_id=current_setting('pr32.shop')::uuid or id=current_setting('pr32.variant')::uuid) <> 0 then failures := array_append(failures,'menu_variants'); end if;
          if (select count(*) from public.menu where shop_id=current_setting('pr32.shop')::uuid or id=current_setting('pr32.menu')::uuid) <> 0 then failures := array_append(failures,'menu'); end if;
          if (select count(*) from public.menu_categories where shop_id=current_setting('pr32.shop')::uuid or id=current_setting('pr32.category')::uuid) <> 0 then failures := array_append(failures,'menu_categories'); end if;
          if (select count(*) from public.menu_serve_types where shop_id=current_setting('pr32.shop')::uuid or id=current_setting('pr32.serve')::uuid) <> 0 then failures := array_append(failures,'menu_serve_types'); end if;
          if not exists (
            select 1 from pg_trigger
            where tgrelid='public.branch'::regclass
              and tgname='trg_prevent_delete_last_branch' and not tgisinternal and tgenabled='O'
          ) then failures := array_append(failures,'trg_prevent_delete_last_branch not ENABLED'); end if;
          if cardinality(failures) <> 0 then
            raise exception 'PR32 cleanup verification failed: %', array_to_string(failures,', ');
          end if;
          raise notice 'PASS cleanup verification: all deterministic fixtures absent and trg_prevent_delete_last_branch ENABLED';
        end
        $cleanup_verification$;

    steps:
      - name: Require main workflow and exact manual confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "FAIL workflow source: dispatch this workflow from main only"
            exit 1
          fi
          echo "PASS workflow source is main"
          if [[ "${{ inputs.confirmation }}" != "VALIDATE_PR32_STAGING" ]]; then
            echo "FAIL confirmation: expected VALIDATE_PR32_STAGING"
            exit 1
          fi
          echo "PASS confirmation"

      - name: Validate staging URL without connecting
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_DATABASE_URL:-}" ]]; then
            echo "FAIL staging identity: STAGING_DATABASE_URL is not configured"
            exit 1
          fi
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse, unquote
          value = os.environ["STAGING_DATABASE_URL"]
          parsed = urlparse(value)
          username = unquote(parsed.username or "")
          host = (parsed.hostname or "").lower()
          port = parsed.port or 5432
          database = parsed.path.lstrip("/")
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("FAIL staging identity: URL is not PostgreSQL")
          if host == os.environ["REJECTED_PRODUCTION_HOST"]:
              raise SystemExit("FAIL staging identity: production host explicitly rejected")
          if host != os.environ["EXPECTED_STAGING_HOST"]:
              raise SystemExit("FAIL staging identity: host is not the approved staging host")
          if port != 5432:
              raise SystemExit("FAIL staging identity: port must be 5432")
          if database != "postgres":
              raise SystemExit("FAIL staging identity: database must be postgres")
          if not re.fullmatch(r"postgres\.[a-z0-9]+", username):
              raise SystemExit("FAIL staging identity: username must be postgres.<project-ref>")
          print("PASS staging URL is PostgreSQL")
          print("PASS staging host matches approved endpoint")
          print("PASS production host rejected")
          print("PASS staging port is 5432")
          print("PASS staging database is postgres")
          print("PASS staging username format")
          PY
          echo "STAGING_IDENTITY_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Check out PR 32 head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/32/head
          fetch-depth: 0

      - name: Verify checked-out PR scope
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "PR32_HEAD_SHA=$sha" >> "$GITHUB_ENV"
          echo "PASS checked out PR 32 head: $sha"
          test -f "$MIGRATION" || { echo "FAIL required migration missing"; exit 1; }
          echo "PASS required migration exists"
          git fetch --no-tags origin main
          mapfile -t github_changes < <(git diff --name-only origin/main...HEAD -- .github)
          if (( ${#github_changes[@]} != 0 )); then
            echo "FAIL PR 32 includes .github changes"
            printf '%s\n' "${github_changes[@]}"
            exit 1
          fi
          echo "PASS PR 32 contains no .github changes"

      - name: Read-only staging preflight
        shell: bash
        run: |
          set -euo pipefail
          psql_staging() {
            docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" postgres:17 \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq'
          }
          check_true() {
            local label="$1" sql="$2" result
            result="$(printf '%s\n' "$sql" | psql_staging)"
            if [[ "$result" != "t" ]]; then
              echo "FAIL preflight: $label"
              exit 1
            fi
            echo "PASS preflight: $label"
          }
          check_true "connection and staging database identity" \
            "select current_database()='postgres' and inet_server_addr() is not null;"
          check_true "public.pos_idempotency exists" \
            "select to_regclass('public.pos_idempotency') is not null;"

          required_tables=(shops branch shop_members menu_categories menu menu_variants menu_serve_types ingredients recipe_items orders order_items stock_logs daily_closes cash_movements)
          for table in "${required_tables[@]}"; do
            check_true "table public.$table exists" "select to_regclass('public.$table') is not null;"
          done

          check_true "required checkout columns exist" "
            with required(table_name,column_name) as (values
              ('pos_idempotency','key'),('pos_idempotency','response'),('pos_idempotency','shop_id'),
              ('branch','id'),('branch','shop_id'),('shop_members','shop_id'),('shop_members','user_id'),('shop_members','role'),
              ('menu','id'),('menu','shop_id'),('menu','name'),('menu','price'),
              ('menu_variants','id'),('menu_variants','menu_id'),('menu_variants','shop_id'),('menu_variants','serve_type_id'),('menu_variants','size'),('menu_variants','price_override'),
              ('menu_serve_types','id'),('menu_serve_types','shop_id'),('menu_serve_types','name'),
              ('ingredients','id'),('ingredients','shop_id'),('ingredients','branch_id'),('ingredients','stock'),
              ('recipe_items','variant_id'),('recipe_items','ingredient_id'),('recipe_items','shop_id'),('recipe_items','quantity'),
              ('orders','id'),('orders','shop_id'),('orders','branch_id'),('orders','total'),('orders','status'),('orders','payment_method'),('orders','paid_amount'),('orders','change_amount'),('orders','paid_at'),('orders','created_at'),
              ('order_items','order_id'),('order_items','menu_id'),('order_items','variant_id'),('order_items','variant_label'),('order_items','name'),('order_items','price'),('order_items','qty'),('order_items','shop_id'),
              ('stock_logs','ingredient_id'),('stock_logs','order_id'),('stock_logs','amount'),('stock_logs','type'),('stock_logs','before_stock'),('stock_logs','after_stock'),('stock_logs','shop_id'),('stock_logs','branch_id')
            )
            select not exists (
              select 1 from required r where not exists (
                select 1 from information_schema.columns c
                where c.table_schema='public' and c.table_name=r.table_name and c.column_name=r.column_name
              )
            );"
          check_true "auth.uid() required checkout function exists" \
            "select to_regprocedure('auth.uid()') is not null;"
          check_true "pgcrypto digest(bytea,text) is available" \
            "select coalesce(to_regprocedure('extensions.digest(bytea,text)'),to_regprocedure('public.digest(bytea,text)')) is not null;"

          state="$(cat <<'SQL' | psql_staging
          with objects as (
            select
              to_regprocedure('public.cancel_order(uuid,text,text,text,boolean)') as cancel_order,
              to_regprocedure('public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)') as cancel_helper,
              to_regprocedure('public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)') as checkout_atomic,
              to_regprocedure('public.create_cash_movement_atomic(uuid,uuid,date,text,text,numeric,text)') as cash_atomic,
              to_regprocedure('public.finalize_daily_close_atomic(uuid,uuid,date,uuid,numeric,text)') as close_atomic,
              exists (
                select 1 from information_schema.columns
                where table_schema='public' and table_name='pos_idempotency' and column_name='request_hash'
              ) as request_hash
          ), checks as (
            select *,
              coalesce((select pg_get_functiondef(cancel_order::oid) like '%cancel_order_without_business_day_guard%' from objects), false) as guarded_cancel_order,
              coalesce((
                select not exists (
                    select 1 from pg_proc p
                    cross join lateral aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) a
                    where p.oid=cancel_helper::oid and a.grantee=0 and a.privilege_type='EXECUTE'
                  )
                  and not has_function_privilege('anon',cancel_helper::oid,'execute')
                  and not has_function_privilege('authenticated',cancel_helper::oid,'execute')
                  and not has_function_privilege('service_role',cancel_helper::oid,'execute')
                from objects where cancel_helper is not null
              ), false) as helper_acl_denied,
              coalesce((
                select count(*)=4 and bool_and(
                  p.prosecdef and coalesce(p.proconfig,'{}') @> array['search_path=pg_catalog, pg_temp']
                )
                from pg_proc p
                where p.oid in (cancel_order::oid,checkout_atomic::oid,cash_atomic::oid,close_atomic::oid)
              ), false) as hardened_wrapper_search_path,
              coalesce((select p.prosecdef from pg_proc p where p.oid=cancel_helper::oid), false) as helper_security_definer,
              not exists (
                select 1 from pg_namespace n
                cross join lateral aclexplode(coalesce(n.nspacl,acldefault('n',n.nspowner))) a
                where n.oid='public'::regnamespace and a.grantee=0 and a.privilege_type='CREATE'
              )
                and not has_schema_privilege('anon','public','create')
                and not has_schema_privilege('authenticated','public','create')
                and not has_schema_privilege('service_role','public','create') as public_schema_create_denied
            from objects
          )
          select concat_ws('|',
            (cancel_order is not null)::text,
            (cancel_helper is not null)::text,
            (checkout_atomic is not null)::text,
            (cash_atomic is not null)::text,
            (close_atomic is not null)::text,
            request_hash::text,
            guarded_cancel_order::text,
            helper_acl_denied::text,
            hardened_wrapper_search_path::text,
            helper_security_definer::text,
            public_schema_create_denied::text
          ) from checks;
          SQL
          )"
          IFS='|' read -r cancel_order helper checkout_atomic cash_atomic close_atomic request_hash guarded_cancel helper_acl hardened helper_security_definer schema_create_denied <<< "$state"

          if [[ "$cancel_order" == true && "$helper" == false && "$checkout_atomic" == false && "$cash_atomic" == false && "$close_atomic" == false && "$request_hash" == false && "$guarded_cancel" == false ]]; then
            echo "MIGRATION_STATE=PRE_MIGRATION" >> "$GITHUB_ENV"
            echo "PASS migration state: PRE_MIGRATION"
          elif [[ "$cancel_order" == true && "$helper" == true && "$checkout_atomic" == true && "$cash_atomic" == true && "$close_atomic" == true && "$request_hash" == true && "$guarded_cancel" == true && "$helper_acl" == true && "$hardened" == true && "$helper_security_definer" == true && "$schema_create_denied" == true ]]; then
            echo "MIGRATION_STATE=FULLY_MIGRATED" >> "$GITHUB_ENV"
            echo "PASS migration state: FULLY_MIGRATED"
            echo "PASS staging already has PR32 migration; migration application will be skipped"
          else
            echo "FAIL migration state: PARTIAL_OR_UNKNOWN"
            echo "cancel_order_present=$cancel_order"
            echo "cancel_helper_present=$helper"
            echo "checkout_atomic_present=$checkout_atomic"
            echo "cash_atomic_present=$cash_atomic"
            echo "close_atomic_present=$close_atomic"
            echo "request_hash_present=$request_hash"
            echo "guarded_cancel_order=$guarded_cancel"
            echo "helper_acl_denied=$helper_acl"
            echo "hardened_wrapper_search_path=$hardened"
            echo "helper_security_definer=$helper_security_definer"
            echo "public_schema_create_denied=$schema_create_denied"
            exit 1
          fi

      - name: Apply only PR 32 atomic migration
        if: env.MIGRATION_STATE == 'PRE_MIGRATION'
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying only $MIGRATION to confirmed staging target"
          docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" postgres:17 \
            sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' < "$MIGRATION"
          echo "PASS migration applied: $MIGRATION"

      - name: Post-migration structural checks
        shell: bash
        run: |
          set -euo pipefail
          psql_staging() {
            docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" postgres:17 \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq'
          }
          check_true() {
            local label="$1" result
            result="$(printf '%s\n' "$2" | psql_staging)"
            [[ "$result" == "t" ]] || { echo "FAIL structural: $label"; exit 1; }
            echo "PASS structural: $label"
          }
          for signature in \
            'public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)' \
            'public.create_cash_movement_atomic(uuid,uuid,date,text,text,numeric,text)' \
            'public.finalize_daily_close_atomic(uuid,uuid,date,uuid,numeric,text)' \
            'public.cancel_order(uuid,text,text,text,boolean)' \
            'public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)'; do
            check_true "$signature exists" "select to_regprocedure('$signature') is not null;"
          done
          check_true "private cancellation helper denied to all exposed roles" "
            with target as (select 'public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)'::regprocedure::oid oid)
            select not exists (
                select 1 from target t join pg_proc p on p.oid=t.oid
                cross join lateral aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) a
                where a.grantee=0 and a.privilege_type='EXECUTE'
              )
              and not has_function_privilege('anon','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute')
              and not has_function_privilege('authenticated','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute')
              and not has_function_privilege('service_role','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute');"
          check_true "private cancellation helper is SECURITY DEFINER" "
            select prosecdef
            from pg_proc
            where oid='public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)'::regprocedure;"
          check_true "guarded SECURITY DEFINER functions have hardened search_path" "
            with target(signature) as (values
              ('public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)'),
              ('public.create_cash_movement_atomic(uuid,uuid,date,text,text,numeric,text)'),
              ('public.finalize_daily_close_atomic(uuid,uuid,date,uuid,numeric,text)'),
              ('public.cancel_order(uuid,text,text,text,boolean)')
            )
            select count(*)=4 and bool_and(
              p.prosecdef and coalesce(p.proconfig,'{}') @> array['search_path=pg_catalog, pg_temp']
            )
            from target t join pg_proc p on p.oid=t.signature::regprocedure::oid;"
          check_true "CREATE on schema public denied to all exposed roles" "
            select not exists (
                select 1 from pg_namespace n
                cross join lateral aclexplode(coalesce(n.nspacl,acldefault('n',n.nspowner))) a
                where n.oid='public'::regnamespace and a.grantee=0 and a.privilege_type='CREATE'
              )
              and not has_schema_privilege('anon','public','create')
              and not has_schema_privilege('authenticated','public','create')
              and not has_schema_privilege('service_role','public','create');"

      - name: Pre-clean stale deterministic staging fixtures
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PR32_FIXTURE_CLEANUP_SQL" | docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e SHOP_ID -e BRANCH_ID -e OTHER_BRANCH_ID -e OWNER_ID -e STAFF_ID -e OUTSIDER_ID \
            -e CATEGORY_ID -e SERVE_ID -e MENU_ID -e VARIANT_ID -e INGREDIENT_ID -e FOREIGN_INGREDIENT_ID \
            postgres:17 sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -v shop="$SHOP_ID" -v branch="$BRANCH_ID" -v other_branch="$OTHER_BRANCH_ID" \
              -v owner="$OWNER_ID" -v staff="$STAFF_ID" -v outsider="$OUTSIDER_ID" \
              -v category="$CATEGORY_ID" -v serve="$SERVE_ID" -v menu="$MENU_ID" \
              -v variant="$VARIANT_ID" -v ingredient="$INGREDIENT_ID" -v foreign_ingredient="$FOREIGN_INGREDIENT_ID" \
              -v close="32000000-0000-4000-8000-00000000000d" \
              -v cash_close="32000000-0000-4000-8000-00000000000e" \
              -v cancel_close="32000000-0000-4000-8000-00000000000f" \
              -v cancel_order="32000000-0000-4000-8000-000000000010"'
          echo "PASS stale deterministic fixtures removed"

      - name: Create isolated staging fixtures atomically
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e SHOP_ID -e BRANCH_ID -e OTHER_BRANCH_ID -e OWNER_ID -e STAFF_ID -e OUTSIDER_ID \
            -e CATEGORY_ID -e SERVE_ID -e MENU_ID -e VARIANT_ID -e INGREDIENT_ID -e FOREIGN_INGREDIENT_ID \
            postgres:17 sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -v shop="$SHOP_ID" -v branch="$BRANCH_ID" -v other_branch="$OTHER_BRANCH_ID" \
              -v owner="$OWNER_ID" -v staff="$STAFF_ID" -v outsider="$OUTSIDER_ID" \
              -v category="$CATEGORY_ID" -v serve="$SERVE_ID" -v menu="$MENU_ID" \
              -v variant="$VARIANT_ID" -v ingredient="$INGREDIENT_ID" -v foreign_ingredient="$FOREIGN_INGREDIENT_ID"' <<'SQL'
          select set_config('pr32.fixture_shop', :'shop', false);
          select set_config('pr32.fixture_branch', :'branch', false);
          begin;
          insert into auth.users(id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at)
          values
            (:'owner','authenticated','authenticated','pr32-owner@example.invalid','',now(),'{}','{}',now(),now()),
            (:'staff','authenticated','authenticated','pr32-staff@example.invalid','',now(),'{}','{}',now(),now()),
            (:'outsider','authenticated','authenticated','pr32-outsider@example.invalid','',now(),'{}','{}',now(),now());
          insert into public.shops(id,name,slug) values(:'shop','PR32 staging validation','pr32-atomic-validation');
          do $fixture_branch_assertion$
          declare
            branch_count integer;
            primary_count integer;
            generated_branch_id uuid;
          begin
            select count(*), count(*) filter (where is_primary), (array_agg(id order by id))[1]
              into branch_count, primary_count, generated_branch_id
            from public.branch where shop_id=current_setting('pr32.fixture_shop')::uuid;
            if branch_count <> 1 or primary_count <> 1 or generated_branch_id is null then
              raise exception 'Expected exactly one auto-created primary branch for fixture shop; branches=%, primaries=%', branch_count, primary_count;
            end if;
            update public.branch
              set id=current_setting('pr32.fixture_branch')::uuid, name='PR32 branch', is_primary=true
              where id=generated_branch_id and shop_id=current_setting('pr32.fixture_shop')::uuid;
            if not found then
              raise exception 'Failed to normalize auto-created primary branch to deterministic BRANCH_ID';
            end if;
          end
          $fixture_branch_assertion$;
          insert into public.branch(id,shop_id,name,is_primary)
            values(:'other_branch',:'shop','PR32 other branch',false);
          insert into public.shop_members(shop_id,user_id,role) values
            (:'shop',:'owner','owner'),(:'shop',:'staff','staff');
          insert into public.menu_categories(id,shop_id,name) values(:'category',:'shop','PR32 category');
          insert into public.menu_serve_types(id,shop_id,name,is_system) values(:'serve',:'shop','PR32 serve',false);
          insert into public.menu(id,shop_id,category_id,name,price) values(:'menu',:'shop',:'category','PR32 drink',100);
          insert into public.menu_variants(id,shop_id,menu_id,serve_type_id,size,price_override,is_default)
            values(:'variant',:'shop',:'menu',:'serve','default',100,true);
          insert into public.ingredients(id,shop_id,branch_id,name,name_key,stock,min_stock,unit,base_unit)
            values(:'ingredient',:'shop',:'branch','PR32 ingredient','pr32 ingredient',100,0,'g','g'),
                  (:'foreign_ingredient',:'shop',:'other_branch','PR32 foreign ingredient','pr32 foreign ingredient',100,0,'g','g');
          insert into public.recipe_items(shop_id,variant_id,ingredient_id,quantity)
            values(:'shop',:'variant',:'ingredient',2);
          commit;
          \echo PASS fixtures created
          SQL

      - name: Run staging integration scenarios
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          psql_file() {
            docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" postgres:17 \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' < "$1"
          }
          auth_sql() { printf "select set_config('request.jwt.claim.sub','%s',false);\n" "$1"; }
          checkout_sql() {
            local actor="$1" key="$2" items="$3"
            auth_sql "$actor"
            printf "select public.process_pos_checkout_atomic('%s','%s','%s'::jsonb,'cash',1000,'%s')::text;\n" "$SHOP_ID" "$BRANCH_ID" "$items" "$key"
          }
          scalar() {
            printf '%s\n' "$1" | docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" postgres:17 sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq'
          }
          expect_fail() {
            local label="$1" file="$2"
            if psql_file "$file" >"$work/out" 2>"$work/err"; then echo "FAIL $label: unexpectedly succeeded"; exit 1; fi
            echo "PASS $label"
          }
          today="$(scalar "select (now() at time zone 'Asia/Bangkok')::date;")"
          items='[{"variant_id":"32000000-0000-4000-8000-00000000000a","qty":1,"sweetness":"100%"}]'

          # 1: two real PostgreSQL processes race on the same idempotency key.
          checkout_sql "$OWNER_ID" "pr32-same-key" "$items" >"$work/same1.sql"
          cp "$work/same1.sql" "$work/same2.sql"
          psql_file "$work/same1.sql" >"$work/same1.out" & p1=$!
          psql_file "$work/same2.sql" >"$work/same2.out" & p2=$!
          wait "$p1"; wait "$p2"
          cmp -s "$work/same1.out" "$work/same2.out" || { echo 'FAIL scenario 1: responses differ'; exit 1; }
          evidence="$(scalar "select count(*)||','||(select count(*) from public.stock_logs where shop_id='$SHOP_ID' and type='deduct')||','||(select stock from public.ingredients where id='$INGREDIENT_ID') from public.orders where shop_id='$SHOP_ID';")"
          [[ "$evidence" == "1,1,98" ]] || { echo "FAIL scenario 1 evidence: $evidence"; exit 1; }
          echo "PASS scenario 1 same-key concurrency: orders,logs,stock=$evidence"

          # 2: changed payload with the same key must fail without mutation.
          checkout_sql "$OWNER_ID" "pr32-same-key" '[{"variant_id":"32000000-0000-4000-8000-00000000000a","qty":1,"sweetness":"50%"}]' >"$work/different.sql"
          expect_fail "scenario 2 same key different request rejected" "$work/different.sql"
          [[ "$(scalar "select count(*) from public.orders where shop_id='$SHOP_ID';")" == 1 ]] || exit 1
          echo "PASS scenario 2 no second mutation: orders=1"

          # 3/4: sweetness lines remain distinct while ingredient deduction aggregates.
          checkout_sql "$STAFF_ID" "pr32-sweetness" '[{"variant_id":"32000000-0000-4000-8000-00000000000a","qty":1,"sweetness":"25%"},{"variant_id":"32000000-0000-4000-8000-00000000000a","qty":2,"sweetness":"75%"}]' >"$work/sweet.sql"
          psql_file "$work/sweet.sql" >"$work/sweet.out"
          evidence="$(scalar "select count(*)||','||sum(qty)||','||(select stock from public.ingredients where id='$INGREDIENT_ID') from public.order_items where order_id=(select id from public.orders where shop_id='$SHOP_ID' order by created_at desc limit 1);")"
          [[ "$evidence" == "2,3,92" ]] || { echo "FAIL scenarios 3/4 evidence: $evidence"; exit 1; }
          echo "PASS scenario 3 sweetness lines distinct: lines=2"
          echo "PASS scenario 4 aggregate deduction: quantity=6 stock=98->92"

          # 5: insufficient stock fully rolls back.
          scalar "update public.ingredients set stock=1 where id='$INGREDIENT_ID';" >/dev/null
          before="$(scalar "select count(*)||','||(select count(*) from public.stock_logs where shop_id='$SHOP_ID') from public.orders where shop_id='$SHOP_ID';")"
          checkout_sql "$OWNER_ID" "pr32-insufficient" "$items" >"$work/insufficient.sql"
          expect_fail "scenario 5 insufficient stock rejected" "$work/insufficient.sql"
          after="$(scalar "select count(*)||','||(select count(*) from public.stock_logs where shop_id='$SHOP_ID')||','||(select count(*) from public.pos_idempotency where shop_id='$SHOP_ID' and key='pr32-insufficient')||','||(select stock from public.ingredients where id='$INGREDIENT_ID') from public.orders where shop_id='$SHOP_ID';")"
          [[ "$after" == "$before,0,1" ]] || { echo "FAIL scenario 5 rollback evidence: before=$before after=$after"; exit 1; }
          echo "PASS scenario 5 rollback: orders/logs unchanged, idempotency=0, stock=1"

          # 6: invalid recipe quantity fully rolls back.
          scalar "update public.ingredients set stock=100 where id='$INGREDIENT_ID'; update public.recipe_items set quantity=0 where shop_id='$SHOP_ID';" >/dev/null
          checkout_sql "$OWNER_ID" "pr32-invalid-recipe" "$items" >"$work/invalid-recipe.sql"
          expect_fail "scenario 6 non-positive recipe rejected" "$work/invalid-recipe.sql"
          [[ "$(scalar "select count(*) from public.pos_idempotency where shop_id='$SHOP_ID' and key='pr32-invalid-recipe';")" == 0 ]] || exit 1
          echo "PASS scenario 6 complete rollback: idempotency=0 stock=100"

          # 7: cross-branch recipe ingredient fully rolls back.
          scalar "update public.recipe_items set quantity=2,ingredient_id='$FOREIGN_INGREDIENT_ID' where shop_id='$SHOP_ID';" >/dev/null
          checkout_sql "$OWNER_ID" "pr32-cross-branch" "$items" >"$work/cross.sql"
          expect_fail "scenario 7 cross-branch ingredient rejected" "$work/cross.sql"
          [[ "$(scalar "select count(*) from public.pos_idempotency where shop_id='$SHOP_ID' and key='pr32-cross-branch';")" == 0 ]] || exit 1
          echo "PASS scenario 7 complete rollback: idempotency=0"
          scalar "update public.recipe_items set ingredient_id='$INGREDIENT_ID' where shop_id='$SHOP_ID';" >/dev/null

          # 8: checkout wins a real two-session race; close waits and includes sale.
          close_id="32000000-0000-4000-8000-00000000000d"
          scalar "insert into public.daily_closes(id,shop_id,branch_id,business_date,opening_cash_float,status) values('$close_id','$SHOP_ID','$BRANCH_ID','$today',0,'draft');" >/dev/null
          { echo 'begin;'; checkout_sql "$OWNER_ID" 'pr32-race-sale' "$items"; echo 'select pg_sleep(2); commit;'; } >"$work/race-sale.sql"
          { auth_sql "$OWNER_ID"; printf "select id from public.finalize_daily_close_atomic('%s','%s','%s','%s',100,'race');\n" "$SHOP_ID" "$BRANCH_ID" "$today" "$close_id"; } >"$work/race-close.sql"
          psql_file "$work/race-sale.sql" >"$work/race-sale.out" & p1=$!; sleep .3
          psql_file "$work/race-close.sql" >"$work/race-close.out" & p2=$!; wait "$p1"; wait "$p2"
          [[ "$(scalar "select paid_order_count from public.daily_closes where id='$close_id';")" -ge 1 ]] || { echo 'FAIL scenario 8 snapshot'; exit 1; }
          echo "PASS scenario 8 checkout/close serialization: sale winner included in snapshot"

          # 9: cash movement wins a real two-session race; close waits and includes it.
          cash_date="$(scalar "select ('$today'::date+1)::date;")"
          cash_close_id="32000000-0000-4000-8000-00000000000e"
          scalar "insert into public.daily_closes(id,shop_id,branch_id,business_date,opening_cash_float,status) values('$cash_close_id','$SHOP_ID','$BRANCH_ID','$cash_date',0,'draft');" >/dev/null
          { echo 'begin;'; auth_sql "$STAFF_ID"; printf "select id from public.create_cash_movement_atomic('%s','%s','%s','cash_in','เติมเงินทอน',10,null);\n" "$SHOP_ID" "$BRANCH_ID" "$cash_date"; echo 'select pg_sleep(2); commit;'; } >"$work/race-cash.sql"
          { auth_sql "$OWNER_ID"; printf "select id from public.finalize_daily_close_atomic('%s','%s','%s','%s',10,null);\n" "$SHOP_ID" "$BRANCH_ID" "$cash_date" "$cash_close_id"; } >"$work/race-cash-close.sql"
          psql_file "$work/race-cash.sql" >"$work/race-cash.out" & p1=$!; sleep .3
          psql_file "$work/race-cash-close.sql" >"$work/race-cash-close.out" & p2=$!; wait "$p1"; wait "$p2"
          evidence="$(scalar "select count(*)||','||expected_cash from public.cash_movements cm cross join public.daily_closes dc where cm.shop_id='$SHOP_ID' and cm.business_date='$cash_date' and dc.id='$cash_close_id' group by dc.expected_cash;")"
          [[ "$evidence" == "1,10" ]] || { echo "FAIL scenario 9 evidence: $evidence"; exit 1; }
          echo "PASS scenario 9 cash/close concurrency: movements,expected_cash=$evidence"

          # 10: cancellation wins a real two-session race; close waits and records it.
          cancel_date="$(scalar "select ('$today'::date-1)::date;")"
          cancel_close_id="32000000-0000-4000-8000-00000000000f"
          cancel_order_id="32000000-0000-4000-8000-000000000010"
          scalar "insert into public.orders(id,shop_id,branch_id,total,status,payment_method,paid_amount,change_amount,paid_at) values('$cancel_order_id','$SHOP_ID','$BRANCH_ID',100,'paid','cash',100,0,('$cancel_date'::date+interval '12 hours')); insert into public.daily_closes(id,shop_id,branch_id,business_date,opening_cash_float,status) values('$cancel_close_id','$SHOP_ID','$BRANCH_ID','$cancel_date',0,'draft');" >/dev/null
          { echo 'begin;'; auth_sql "$OWNER_ID"; printf "select public.cancel_order('%s','ลูกค้ายกเลิก',null,'spoofed',false);\n" "$cancel_order_id"; echo 'select pg_sleep(2); commit;'; } >"$work/race-cancel.sql"
          { auth_sql "$OWNER_ID"; printf "select id from public.finalize_daily_close_atomic('%s','%s','%s','%s',0,null);\n" "$SHOP_ID" "$BRANCH_ID" "$cancel_date" "$cancel_close_id"; } >"$work/race-cancel-close.sql"
          psql_file "$work/race-cancel.sql" >"$work/race-cancel.out" & p1=$!; sleep .3
          psql_file "$work/race-cancel-close.sql" >"$work/race-cancel-close.out" & p2=$!; wait "$p1"; wait "$p2"
          evidence="$(scalar "select o.status||','||dc.cancelled_order_count from public.orders o cross join public.daily_closes dc where o.id='$cancel_order_id' and dc.id='$cancel_close_id';")"
          [[ "$evidence" == "cancelled,1" ]] || { echo "FAIL scenario 10 evidence: $evidence"; exit 1; }
          echo "PASS scenario 10 cancellation/close concurrency: status,cancelled_count=$evidence"

          # 11: owner/staff succeeded above; outsider and anonymous are denied.
          checkout_sql "$OUTSIDER_ID" 'pr32-outsider' "$items" >"$work/outsider.sql"
          expect_fail "scenario 11 outsider denied" "$work/outsider.sql"
          checkout_sql '' 'pr32-anon' "$items" >"$work/anon.sql"
          expect_fail "scenario 11 anonymous denied" "$work/anon.sql"
          echo "PASS scenario 11 owner/staff allowed and outsider/anon denied"

          # 12: ACL evidence for every exposed role.
          acl="$(scalar "with target as (select 'public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)'::regprocedure::oid oid), pub as (select exists(select 1 from target t join pg_proc p on p.oid=t.oid cross join lateral aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) a where a.grantee=0 and a.privilege_type='EXECUTE') allowed) select pub.allowed::int||','||has_function_privilege('anon','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute')::int||','||has_function_privilege('authenticated','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute')::int||','||has_function_privilege('service_role','public.cancel_order_without_business_day_guard(uuid,text,text,text,boolean)','execute')::int from pub;")"
          [[ "$acl" == "0,0,0,0" ]] || { echo "FAIL scenario 12 ACL evidence: $acl"; exit 1; }
          echo "PASS scenario 12 private helper ACL public,anon,authenticated,service_role=$acl"

          # 13: exact response object key sets.
          response="$(cat "$work/same1.out" | tail -n1)"
          contract="$(scalar "with r as (select '$response'::jsonb j) select ((select array_agg(k order by k) from jsonb_object_keys((select j->'order' from r)) k)=array['branch_id','created_at','id','items','note','paid_at','payment_method','shop_id','status','total']) and ((select array_agg(k order by k) from jsonb_object_keys((select j->'order'->'items'->0 from r)) k)=array['menu_id','name','price','qty','variant_id','variant_label']) and ((select array_agg(k order by k) from jsonb_object_keys((select j->'deducted'->0 from r)) k)=array['after_stock','before_stock','deduct','ingredient_id']);")"
          [[ "$contract" == t ]] || { echo 'FAIL scenario 13 response contract'; exit 1; }
          echo "PASS scenario 13 POS JSON response contract"

      - name: Clean up all staging validation fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STAGING_IDENTITY_VALIDATED:-}" != "true" ]]; then
            echo "Cleanup skipped: staging identity was not validated"
            exit 0
          fi
          printf '%s\n' "$PR32_FIXTURE_CLEANUP_SQL" | docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e SHOP_ID -e BRANCH_ID -e OTHER_BRANCH_ID -e OWNER_ID -e STAFF_ID -e OUTSIDER_ID \
            -e CATEGORY_ID -e SERVE_ID -e MENU_ID -e VARIANT_ID -e INGREDIENT_ID -e FOREIGN_INGREDIENT_ID \
            postgres:17 sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -v shop="$SHOP_ID" -v branch="$BRANCH_ID" -v other_branch="$OTHER_BRANCH_ID" \
              -v owner="$OWNER_ID" -v staff="$STAFF_ID" -v outsider="$OUTSIDER_ID" \
              -v category="$CATEGORY_ID" -v serve="$SERVE_ID" -v menu="$MENU_ID" \
              -v variant="$VARIANT_ID" -v ingredient="$INGREDIENT_ID" -v foreign_ingredient="$FOREIGN_INGREDIENT_ID" \
              -v close="32000000-0000-4000-8000-00000000000d" \
              -v cash_close="32000000-0000-4000-8000-00000000000e" \
              -v cancel_close="32000000-0000-4000-8000-00000000000f" \
              -v cancel_order="32000000-0000-4000-8000-000000000010"'
          echo "PASS cleanup: staging fixture shop ID $SHOP_ID removed"
