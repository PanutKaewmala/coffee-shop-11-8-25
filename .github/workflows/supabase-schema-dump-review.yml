name: Supabase Schema Dump Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump production schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" --file supabase-schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      - name: Upload schema dump
        uses: actions/upload-artifact@v4
        with:
          name: supabase-schema-dump
          path: supabase-schema.sql
          if-no-files-found: error
