name: Supabase Schema Dump Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-production-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump production public schema only
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          mkdir -p /tmp/coffee-saas-schema
          supabase db dump \
            --db-url "$PRODUCTION_DATABASE_URL" \
            --schema public \
            --file /tmp/coffee-saas-schema/production-public-schema.sql

      - name: Basic dump verification
        run: |
          test -s /tmp/coffee-saas-schema/production-public-schema.sql
          echo "Schema dump size:"
          wc -c /tmp/coffee-saas-schema/production-public-schema.sql
          echo "Top-level COPY statements:"
          grep -n '^COPY ' /tmp/coffee-saas-schema/production-public-schema.sql || true

      - name: Upload schema dump for review
        uses: actions/upload-artifact@v4
        with:
          name: production-public-schema-review
          path: /tmp/coffee-saas-schema/production-public-schema.sql
          retention-days: 1
