name: Validate TALVO ReceiveSupplyItem on staging v3

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VALIDATE_TALVO_RECEIVE_STAGING"
        required: true
        type: string
      target_sha:
        description: "Exact approved feature commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-database-mutation
  cancel-in-progress: false

env:
  TRUSTED_TALVO_BASE_SHA: 3ccff98461e601a52f2dc00d7b6a4afc0552824b
  POSTGRES_17_IMAGE: postgres:17.11-trixie@sha256:f86c774c7a51d0f05133f2ab70e4c384b589170458ab1df1ba83426d7cc30da7
  SHOP_ID: 34100000-0000-4000-8000-000000000001
  BRANCH_ID: 34100000-0000-4000-8000-000000000002
  OTHER_BRANCH_ID: 34100000-0000-4000-8000-000000000003
  OWNER_ID: 34100000-0000-4000-8000-000000000004
  OTHER_OWNER_ID: 34100000-0000-4000-8000-000000000005

jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
    steps:
      - name: Require trusted main dispatch
        id: guard
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          RAW_CONFIRMATION: ${{ inputs.confirmation }}
          RAW_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          confirmation="$(trim "$RAW_CONFIRMATION")"
          target_sha="$(trim "$RAW_TARGET_SHA")"
          echo "dispatch_ref_name=$REF_NAME"
          echo "confirmation_length=${#confirmation}"
          echo "target_sha_length=${#target_sha}"
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Dispatch branch must be main; got '$REF_NAME'"
            exit 1
          fi
          if [[ "$confirmation" != "VALIDATE_TALVO_RECEIVE_STAGING" ]]; then
            echo "::error::Confirmation mismatch after trimming whitespace"
            exit 1
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be exactly 40 lowercase hex characters after trimming whitespace"
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.guard.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target and static contract
        shell: bash
        env:
          TARGET_SHA: ${{ steps.guard.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "::error::Checkout differs from normalized target SHA"; exit 1; }
          git cat-file -e "$TRUSTED_TALVO_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$TRUSTED_TALVO_BASE_SHA" "$TARGET_SHA" || { echo "::error::Target does not descend from trusted TALVO base"; exit 1; }
          for f in \
            supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql \
            supabase/migrations/20260819180000_talvo_receive_supply_item.sql \
            supabase/migrations/20260819180100_talvo_receive_history_hardening.sql \
            supabase/tests/talvo_receive_supply_item_integration.sql \
            scripts/test-talvo-receive-supply-item.mjs; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::Missing regular file: $f"; exit 1; }
          done
          node scripts/test-talvo-receive-supply-item.mjs
          python3 - <<'PY'
          import pathlib
          for p in map(pathlib.Path, [
            'supabase/migrations/20260819180000_talvo_receive_supply_item.sql',
            'supabase/migrations/20260819180100_talvo_receive_history_hardening.sql']):
            for n,line in enumerate(p.read_text().splitlines(),1):
              if line.strip().lower() in {'commit;','rollback;'}:
                raise SystemExit(f'FAIL forbidden transaction control {p}:{n}')
              if '`' in line:
                raise SystemExit(f'FAIL forbidden backtick {p}:{n}')
          p=pathlib.Path('supabase/tests/talvo_receive_supply_item_integration.sql')
          lines=p.read_text().splitlines()
          shape=(sum(x.strip().lower()=='begin;' for x in lines),sum(x.strip().lower()=='rollback;' for x in lines),sum(x.strip().lower()=='commit;' for x in lines))
          if shape != (1,1,0): raise SystemExit(f'FAIL integration transaction shape {shape}')
          for n,line in enumerate(lines,1):
            s=line.lstrip()
            if '`' in line or s.startswith('\\!') or s.startswith('\\copy'):
              raise SystemExit(f'FAIL forbidden psql command line {n}')
          PY
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo "::error::Static validation mutated checkout"; exit 1; }

  validate-staging:
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: talvo-staging
    env:
      APPROVED_TALVO_TARGET_SHA: ${{ vars.APPROVED_TALVO_TARGET_SHA }}
      EXPECTED_STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}
    steps:
      - name: Require protected target and exact staging identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_TALVO_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::APPROVED_TALVO_TARGET_SHA missing or invalid"; exit 1; }
          [[ "$TARGET_SHA" == "$APPROVED_TALVO_TARGET_SHA" ]] || { echo "::error::Normalized target SHA is not the protected approved SHA"; exit 1; }
          [[ "$EXPECTED_STAGING_PROJECT_REF" =~ ^[a-z0-9]+$ ]] || { echo "::error::STAGING_PROJECT_REF missing or invalid"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import unquote,urlparse
          p=urlparse(os.environ['STAGING_DATABASE_URL']); host=(p.hostname or '').lower()
          if p.scheme not in {'postgres','postgresql'}: raise SystemExit('FAIL scheme')
          if host != 'aws-0-ap-southeast-2.pooler.supabase.com': raise SystemExit('FAIL staging host')
          if host == 'aws-1-ap-southeast-1.pooler.supabase.com': raise SystemExit('FAIL production host')
          if (p.port or 5432)!=5432 or p.path.lstrip('/')!='postgres': raise SystemExit('FAIL endpoint')
          if unquote(p.username or '')!='postgres.'+os.environ['EXPECTED_STAGING_PROJECT_REF']: raise SystemExit('FAIL project ref')
          PY
          echo STAGING_IDENTITY_VALIDATED=true >> "$GITHUB_ENV"

      - name: Check out exact target as database input only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify approved staging baseline
        shell: bash
        run: |
          set -euo pipefail
          f=supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql
          expected="$(sha256sum "$f" | awk '{print $1}')"
          actual="$(docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' <<'SQL'
          select coalesce((select source_sha256 from talvo.schema_revisions where version='20260817100000'),'');
          SQL
          )"
          [[ "$actual" == "$expected" ]] || { echo "::error::Staging TALVO baseline checksum mismatch"; exit 1; }

      - name: Build rollback-only runtime script
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/integration.sql <<'PY'
          import pathlib
          p=pathlib.Path('supabase/tests/talvo_receive_supply_item_integration.sql')
          lines=p.read_text().splitlines(); removed=0
          for line in lines:
            if line.strip().lower()=='begin;' and not removed:
              removed=1; continue
            print(line)
          if removed != 1: raise SystemExit('FAIL opening BEGIN')
          PY
          cat > /tmp/runtime.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          do $preflight$ begin
            if to_regnamespace('talvo') is null or to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is null then
              raise exception 'TALVO_APPROVED_BASELINE_MISSING';
            end if;
          end $preflight$;
          SQL
          cat supabase/migrations/20260819180000_talvo_receive_supply_item.sql >> /tmp/runtime.sql
          printf '\n' >> /tmp/runtime.sql
          cat supabase/migrations/20260819180100_talvo_receive_history_hardening.sql >> /tmp/runtime.sql
          cat >> /tmp/runtime.sql <<'SQL'
          select set_config('talvo_fixture.shop', :'talvo_business_id', true);
          select set_config('talvo_fixture.branch', :'talvo_branch_id', true);
          select set_config('talvo_fixture.other_branch', :'talvo_other_branch_id', true);
          select set_config('talvo_fixture.actor', :'talvo_actor_id', true);
          select set_config('talvo_fixture.other_actor', :'talvo_other_actor_id', true);
          do $namespace_guard$ begin
            if exists(select 1 from public.shops where id=current_setting('talvo_fixture.shop')::uuid)
              or exists(select 1 from public.branch where id in (current_setting('talvo_fixture.branch')::uuid,current_setting('talvo_fixture.other_branch')::uuid))
              or exists(select 1 from auth.users where id in (current_setting('talvo_fixture.actor')::uuid,current_setting('talvo_fixture.other_actor')::uuid)) then
              raise exception 'TALVO_RECEIVE_FIXTURE_NAMESPACE_COLLISION';
            end if;
          end $namespace_guard$;
          insert into auth.users(id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at) values
            (current_setting('talvo_fixture.actor')::uuid,'authenticated','authenticated','talvo-receive-owner@example.invalid','',now(),'{}','{}',now(),now()),
            (current_setting('talvo_fixture.other_actor')::uuid,'authenticated','authenticated','talvo-receive-owner-2@example.invalid','',now(),'{}','{}',now(),now());
          insert into public.shops(id,name,slug) values(current_setting('talvo_fixture.shop')::uuid,'TALVO receive validation','talvo-receive-validation');
          do $normalize$ declare generated uuid; begin
            select id into generated from public.branch where shop_id=current_setting('talvo_fixture.shop')::uuid order by id limit 1;
            if generated is null then raise exception 'Expected shop trigger primary branch'; end if;
            update public.branch set id=current_setting('talvo_fixture.branch')::uuid,name='TALVO receive branch A',is_primary=true,is_active=false where id=generated;
          end $normalize$;
          insert into public.branch(id,shop_id,name,is_primary,is_active) values(current_setting('talvo_fixture.other_branch')::uuid,current_setting('talvo_fixture.shop')::uuid,'TALVO receive branch B',false,false);
          insert into public.shop_members(shop_id,user_id,role) values
            (current_setting('talvo_fixture.shop')::uuid,current_setting('talvo_fixture.actor')::uuid,'owner'),
            (current_setting('talvo_fixture.shop')::uuid,current_setting('talvo_fixture.other_actor')::uuid,'owner');
          insert into talvo.inventory_locations(business_id,branch_id,kind)
          select current_setting('talvo_fixture.shop')::uuid,b.id,k.kind from public.branch b cross join (values ('BRANCH_AVAILABLE'),('BRANCH_QUARANTINE')) k(kind)
          where b.shop_id=current_setting('talvo_fixture.shop')::uuid;
          update public.branch set is_active=true where shop_id=current_setting('talvo_fixture.shop')::uuid;
          SQL
          cat /tmp/integration.sql >> /tmp/runtime.sql

      - name: Run ReceiveSupplyItem and roll back everything
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" -v /tmp/runtime.sql:/runtime.sql:ro "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v talvo_business_id="$1" -v talvo_branch_id="$2" -v talvo_other_branch_id="$3" -v talvo_actor_id="$4" -v talvo_other_actor_id="$5" -f /runtime.sql' sh "$SHOP_ID" "$BRANCH_ID" "$OTHER_BRANCH_ID" "$OWNER_ID" "$OTHER_OWNER_ID")"
          printf '%s\n' "$output"
          [[ "$(printf '%s\n' "$output" | tail -n1)" == 'TALVO ReceiveSupplyItem integration contract passed (transaction rolled back)' ]] || { echo "::error::Integration completion marker missing"; exit 1; }

      - name: Prove staging unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${STAGING_IDENTITY_VALIDATED:-}" == true ]] || { echo 'identity not validated; no DB check'; exit 0; }
          result="$(docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' <<SQL
          select concat_ws('|',(to_regprocedure('public.receive_talvo_supply_item(uuid,uuid,uuid,numeric,text,text,timestamptz,text)') is null)::text,(not exists(select 1 from public.shops where id='$SHOP_ID'))::text,(not exists(select 1 from public.branch where id in ('$BRANCH_ID','$OTHER_BRANCH_ID')))::text,(not exists(select 1 from auth.users where id in ('$OWNER_ID','$OTHER_OWNER_ID')))::text,(not exists(select 1 from talvo.role_capabilities where capability='inventory.stock.receive'))::text);
          SQL
          )"
          [[ "$result" == 'true|true|true|true|true' ]] || { echo "FAIL rollback residue: $result"; exit 1; }
          echo 'PASS rollback left staging unchanged'
