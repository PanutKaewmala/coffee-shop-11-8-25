name: Validate TALVO ReceiveSupplyItem on staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VALIDATE_TALVO_RECEIVE_STAGING"
        required: true
        type: string
      target_sha:
        description: "Exact feature commit SHA; must equal talvo-staging APPROVED_TALVO_TARGET_SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-database-mutation
  cancel-in-progress: false

env:
  # PR #44 was cut from this already-staging-validated main commit. The feature
  # target must descend from it; it cannot descend from the future validator
  # merge commit because the feature branch already exists.
  TRUSTED_TALVO_BASE_SHA: 3ccff98461e601a52f2dc00d7b6a4afc0552824b

jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main dispatch and exact immutable target
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "FAIL dispatch this workflow from main only"; exit 1; }
          [[ "$CONFIRMATION" == "VALIDATE_TALVO_RECEIVE_STAGING" ]] || { echo "FAIL confirmation mismatch"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL target_sha must be lowercase 40-char SHA"; exit 1; }

      - name: Check out exact target without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target and source contract
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "FAIL checkout differs from target"; exit 1; }
          git cat-file -e "$TRUSTED_TALVO_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$TRUSTED_TALVO_BASE_SHA" "$TARGET_SHA" || {
            echo "FAIL target does not descend from the approved TALVO base"
            exit 1
          }
          for path in \
            supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql \
            supabase/migrations/20260819180000_talvo_receive_supply_item.sql \
            supabase/migrations/20260819180100_talvo_receive_history_hardening.sql \
            supabase/tests/talvo_receive_supply_item_integration.sql \
            scripts/test-talvo-receive-supply-item.mjs; do
            [[ -f "$path" && ! -L "$path" ]] || { echo "FAIL missing regular file: $path"; exit 1; }
          done
          node scripts/test-talvo-receive-supply-item.mjs
          python3 - <<'PY'
          import pathlib

          migrations = [
              pathlib.Path('supabase/migrations/20260819180000_talvo_receive_supply_item.sql'),
              pathlib.Path('supabase/migrations/20260819180100_talvo_receive_history_hardening.sql'),
          ]
          for path in migrations:
              for line_number, line in enumerate(path.read_text().splitlines(), start=1):
                  stripped = line.strip().lower()
                  if stripped in {'commit;', 'rollback;'}:
                      raise SystemExit(f'FAIL {path}:{line_number}: transaction control is forbidden in rollback-only feature input')
                  if '`' in line:
                      raise SystemExit(f'FAIL {path}:{line_number}: shell-style backticks are forbidden')

          integration = pathlib.Path('supabase/tests/talvo_receive_supply_item_integration.sql').read_text().splitlines()
          begins = sum(line.strip().lower() == 'begin;' for line in integration)
          rollbacks = sum(line.strip().lower() == 'rollback;' for line in integration)
          commits = sum(line.strip().lower() == 'commit;' for line in integration)
          if (begins, rollbacks, commits) != (1, 1, 0):
              raise SystemExit(f'FAIL integration transaction wrapper: begin={begins} rollback={rollbacks} commit={commits}')
          for line_number, line in enumerate(integration, start=1):
              if '`' in line or line.lstrip().startswith('\\!') or line.lstrip().startswith('\\copy'):
                  raise SystemExit(f'FAIL integration test line {line_number}: shell/file psql commands are forbidden')
          print('PASS rollback-only source shape')
          PY
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo "FAIL static validation mutated checkout"; exit 1; }

  validate-staging:
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: talvo-staging
    env:
      APPROVED_TALVO_TARGET_SHA: ${{ vars.APPROVED_TALVO_TARGET_SHA }}
      EXPECTED_STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      EXPECTED_STAGING_HOST: aws-0-ap-southeast-2.pooler.supabase.com
      REJECTED_PRODUCTION_HOST: aws-1-ap-southeast-1.pooler.supabase.com
      POSTGRES_17_IMAGE: postgres:17.11-trixie@sha256:f86c774c7a51d0f05133f2ab70e4c384b589170458ab1df1ba83426d7cc30da7
      BASE_MIGRATION: supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql
      RECEIVE_MIGRATION: supabase/migrations/20260819180000_talvo_receive_supply_item.sql
      HISTORY_HARDENING: supabase/migrations/20260819180100_talvo_receive_history_hardening.sql
      INTEGRATION_TEST: supabase/tests/talvo_receive_supply_item_integration.sql
      SHOP_ID: 34100000-0000-4000-8000-000000000001
      BRANCH_ID: 34100000-0000-4000-8000-000000000002
      OTHER_BRANCH_ID: 34100000-0000-4000-8000-000000000003
      OWNER_ID: 34100000-0000-4000-8000-000000000004
      OTHER_OWNER_ID: 34100000-0000-4000-8000-000000000005
    steps:
      - name: Require protected target approval
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "${APPROVED_TALVO_TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL APPROVED_TALVO_TARGET_SHA missing"; exit 1; }
          [[ "$TARGET_SHA" == "$APPROVED_TALVO_TARGET_SHA" ]] || { echo "FAIL target is not protected approved SHA"; exit 1; }

      - name: Validate exact staging identity without connecting
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${STAGING_DATABASE_URL:-}" ]]
          [[ "${EXPECTED_STAGING_PROJECT_REF:-}" =~ ^[a-z0-9]+$ ]]
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse
          p=urlparse(os.environ['STAGING_DATABASE_URL'])
          host=(p.hostname or '').lower(); username=unquote(p.username or '')
          if p.scheme not in {'postgres','postgresql'}: raise SystemExit('FAIL staging URL scheme')
          if host == os.environ['REJECTED_PRODUCTION_HOST']: raise SystemExit('FAIL production explicitly rejected')
          if host != os.environ['EXPECTED_STAGING_HOST']: raise SystemExit('FAIL unexpected staging host')
          if (p.port or 5432) != 5432 or p.path.lstrip('/') != 'postgres': raise SystemExit('FAIL staging endpoint shape')
          if username != 'postgres.'+os.environ['EXPECTED_STAGING_PROJECT_REF']: raise SystemExit('FAIL staging project ref mismatch')
          print('PASS exact staging identity')
          PY
          echo "STAGING_IDENTITY_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Check out exact target as database input only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify approved CreateSupplyItem baseline checksum
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          base_sha="$(sha256sum "$BASE_MIGRATION" | awk '{print $1}')"
          actual="$(docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' <<'SQL'
          select coalesce((select source_sha256 from talvo.schema_revisions where version='20260817100000'),'');
          SQL
          )"
          [[ "$actual" == "$base_sha" ]] || { echo "FAIL staging TALVO baseline checksum mismatch"; exit 1; }
          echo "PASS staging baseline checksum=$base_sha"

      - name: Build rollback-only runtime validation script
        shell: bash
        run: |
          set -euo pipefail
          # The integration contract already owns the final ROLLBACK and psql
          # variable setup. Remove only its opening BEGIN so the migration,
          # fixtures, and tests share one outer transaction. Preserve all \gset
          # commands because later assertions depend on the variables they set.
          python3 - "$INTEGRATION_TEST" > /tmp/integration-body.sql <<'PY'
          import pathlib, sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          removed_begin = 0
          out = []
          for line in lines:
              if line.strip().lower() == 'begin;' and removed_begin == 0:
                  removed_begin = 1
                  continue
              out.append(line)
          if removed_begin != 1:
              raise SystemExit('FAIL integration opening BEGIN not found exactly once')
          print('\n'.join(out))
          PY

          cat > /tmp/runtime.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;
          do $preflight$
          begin
            if to_regnamespace('talvo') is null
               or to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is null then
              raise exception 'TALVO_APPROVED_BASELINE_MISSING';
            end if;
          end
          $preflight$;
          SQL
          cat "$RECEIVE_MIGRATION" >> /tmp/runtime.sql
          printf '\n' >> /tmp/runtime.sql
          cat "$HISTORY_HARDENING" >> /tmp/runtime.sql
          cat >> /tmp/runtime.sql <<'SQL'
          do $namespace_guard$
          begin
            if exists(select 1 from public.shops where id=:'talvo_business_id')
               or exists(select 1 from public.branch where id in (:'talvo_branch_id',:'talvo_other_branch_id'))
               or exists(select 1 from auth.users where id in (:'talvo_actor_id',:'talvo_other_actor_id')) then
              raise exception 'TALVO_RECEIVE_FIXTURE_NAMESPACE_COLLISION';
            end if;
          end
          $namespace_guard$;
          insert into auth.users(id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at) values
            (:'talvo_actor_id','authenticated','authenticated','talvo-receive-owner@example.invalid','',now(),'{}','{}',now(),now()),
            (:'talvo_other_actor_id','authenticated','authenticated','talvo-receive-owner-2@example.invalid','',now(),'{}','{}',now(),now());
          insert into public.shops(id,name,slug) values(:'talvo_business_id','TALVO receive validation','talvo-receive-validation');
          select set_config('talvo_fixture.shop', :'talvo_business_id', false);
          select set_config('talvo_fixture.branch', :'talvo_branch_id', false);
          do $normalize_primary_branch$
          declare generated_branch_id uuid;
          begin
            select id into generated_branch_id
            from public.branch
            where shop_id=current_setting('talvo_fixture.shop')::uuid
            order by id
            limit 1;
            if generated_branch_id is null then raise exception 'Expected shop trigger primary branch'; end if;
            update public.branch
            set id=current_setting('talvo_fixture.branch')::uuid,
                name='TALVO receive branch A',is_primary=true,is_active=false
            where id=generated_branch_id;
          end
          $normalize_primary_branch$;
          insert into public.branch(id,shop_id,name,is_primary,is_active)
          values(:'talvo_other_branch_id',:'talvo_business_id','TALVO receive branch B',false,false);
          insert into public.shop_members(shop_id,user_id,role) values
            (:'talvo_business_id',:'talvo_actor_id','owner'),
            (:'talvo_business_id',:'talvo_other_actor_id','owner');
          insert into talvo.inventory_locations(business_id,branch_id,kind)
          select :'talvo_business_id',b.id,k.kind
          from public.branch b
          cross join (values ('BRANCH_AVAILABLE'),('BRANCH_QUARANTINE')) k(kind)
          where b.shop_id=:'talvo_business_id';
          update public.branch set is_active=true where shop_id=:'talvo_business_id';
          SQL
          cat /tmp/integration-body.sql >> /tmp/runtime.sql

      - name: Run ReceiveSupplyItem against staging and roll back everything
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          output="$(docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -v /tmp/runtime.sql:/runtime.sql:ro \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -v talvo_business_id="$1" -v talvo_branch_id="$2" -v talvo_other_branch_id="$3" \
              -v talvo_actor_id="$4" -v talvo_other_actor_id="$5" -f /runtime.sql' sh \
            "$SHOP_ID" "$BRANCH_ID" "$OTHER_BRANCH_ID" "$OWNER_ID" "$OTHER_OWNER_ID")"
          printf '%s\n' "$output"
          [[ "$(printf '%s\n' "$output" | tail -n1)" == \
            "TALVO ReceiveSupplyItem integration contract passed (transaction rolled back)" ]] || {
            echo 'FAIL integration completion marker missing'
            exit 1
          }

      - name: Prove validation left staging unchanged
        if: always()
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ "${STAGING_IDENTITY_VALIDATED:-}" != 'true' ]]; then
            echo 'Residue check skipped: staging identity was not validated'
            exit 0
          fi
          result="$(docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' <<SQL
          select concat_ws('|',
            (to_regprocedure('public.receive_talvo_supply_item(uuid,uuid,uuid,numeric,text,text,timestamptz,text)') is null)::text,
            (not exists(select 1 from public.shops where id='$SHOP_ID'))::text,
            (not exists(select 1 from public.branch where id in ('$BRANCH_ID','$OTHER_BRANCH_ID')))::text,
            (not exists(select 1 from auth.users where id in ('$OWNER_ID','$OTHER_OWNER_ID')))::text,
            (not exists(select 1 from talvo.role_capabilities where capability='inventory.stock.receive'))::text
          );
          SQL
          )"
          [[ "$result" == 'true|true|true|true|true' ]] || { echo "FAIL rollback residue: $result"; exit 1; }
          echo 'PASS rollback left staging unchanged'
