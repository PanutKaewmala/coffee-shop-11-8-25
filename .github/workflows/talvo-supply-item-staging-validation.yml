name: Validate TALVO CreateSupplyItem on staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VALIDATE_TALVO_SUPPLY_ITEM_STAGING"
        required: true
        type: string
      target_sha:
        description: "Exact commit SHA; must equal talvo-staging APPROVED_TALVO_TARGET_SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Every workflow that mutates the shared staging database must use this
  # repository-wide lock. UUID isolation is not enough because migrations and
  # global triggers still share the same PostgreSQL catalogs and tables.
  group: staging-database-mutation
  cancel-in-progress: false

jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main workflow, exact confirmation, and immutable target
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "FAIL: dispatch this workflow from main only"
            exit 1
          }
          [[ "$CONFIRMATION" == "VALIDATE_TALVO_SUPPLY_ITEM_STAGING" ]] || {
            echo "FAIL: confirmation text does not match"
            exit 1
          }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: target_sha must be an exact lowercase 40-character commit SHA"
            exit 1
          }
          echo "PASS guarded dispatch inputs"

      - name: Check out exact target without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target source in a secret-free job
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || {
            echo "FAIL checked-out commit differs from target_sha"
            exit 1
          }
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$TARGET_SHA" || {
            echo "FAIL target_sha must contain the dispatched main commit"
            exit 1
          }
          for path in \
            .github/scripts/talvo-recovery-manifest.sql \
            supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql \
            supabase/tests/talvo_create_supply_item_integration.sql \
            scripts/test-talvo-staging-workflow.mjs \
            scripts/test-talvo-create-supply-item.mjs; do
            [[ -f "$path" && ! -L "$path" ]] || {
              echo "FAIL target contract must be a regular file: $path"
              exit 1
            }
          done
          sha256sum \
            supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql \
            supabase/tests/talvo_create_supply_item_integration.sql
          node scripts/test-talvo-staging-workflow.mjs
          node scripts/test-talvo-create-supply-item.mjs
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "FAIL target static test mutated its checkout"
            git status --short
            exit 1
          }
          echo "PASS target source verified without database secrets or persisted credentials"

  validate-staging:
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: talvo-staging
    env:
      APPROVED_TALVO_TARGET_SHA: ${{ vars.APPROVED_TALVO_TARGET_SHA }}
      EXPECTED_STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      EXPECTED_STAGING_HOST: aws-0-ap-southeast-2.pooler.supabase.com
      REJECTED_PRODUCTION_HOST: aws-1-ap-southeast-1.pooler.supabase.com
      POSTGRES_17_IMAGE: postgres:17.11-trixie@sha256:f86c774c7a51d0f05133f2ab70e4c384b589170458ab1df1ba83426d7cc30da7
      MIGRATION: supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql
      MIGRATION_VERSION: "20260817100000"
      INTEGRATION_TEST: supabase/tests/talvo_create_supply_item_integration.sql
      RECOVERY_MANIFEST_SQL: .github/scripts/talvo-recovery-manifest.sql
      TALVO_DB_PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=45000 -c idle_in_transaction_session_timeout=120000"
      SHOP_ID: 34000000-0000-4000-8000-000000000001
      BRANCH_ID: 34000000-0000-4000-8000-000000000002
      OTHER_BRANCH_ID: 34000000-0000-4000-8000-000000000003
      OWNER_ID: 34000000-0000-4000-8000-000000000004
      OTHER_OWNER_ID: 34000000-0000-4000-8000-000000000005
      TALVO_FIXTURE_CLEANUP_SQL: |
        select set_config('talvo_test.shop', :'shop', false);
        select set_config('talvo_test.branch', :'branch', false);
        select set_config('talvo_test.other_branch', :'other_branch', false);
        select set_config('talvo_test.owner', :'owner', false);
        select set_config('talvo_test.other_owner', :'other_owner', false);
        do $fixture_namespace_guard$
        begin
          if exists(
            select 1 from public.shops
            where id=current_setting('talvo_test.shop')::uuid
              and (
                slug is distinct from 'talvo-supply-item-validation'
                or name is distinct from 'TALVO staging validation'
              )
          ) then
            raise exception 'TALVO_FIXTURE_SHOP_ID_COLLISION';
          end if;
          if exists(
            select 1 from public.branch
            where id in (
              current_setting('talvo_test.branch')::uuid,
              current_setting('talvo_test.other_branch')::uuid
            )
              and shop_id<>current_setting('talvo_test.shop')::uuid
          ) or exists(
            select 1 from public.branch
            where shop_id=current_setting('talvo_test.shop')::uuid
              and id not in (
                current_setting('talvo_test.branch')::uuid,
                current_setting('talvo_test.other_branch')::uuid
              )
          ) then
            raise exception 'TALVO_FIXTURE_BRANCH_NAMESPACE_COLLISION';
          end if;
          if exists(
            select 1 from public.shop_members
            where user_id in (
              current_setting('talvo_test.owner')::uuid,
              current_setting('talvo_test.other_owner')::uuid
            )
              and shop_id<>current_setting('talvo_test.shop')::uuid
          ) or exists(
            select 1 from public.shop_members
            where shop_id=current_setting('talvo_test.shop')::uuid
              and user_id not in (
                current_setting('talvo_test.owner')::uuid,
                current_setting('talvo_test.other_owner')::uuid
              )
          ) then
            raise exception 'TALVO_FIXTURE_MEMBER_NAMESPACE_COLLISION';
          end if;
          if exists(
            select 1 from auth.users
            where id=current_setting('talvo_test.owner')::uuid
              and email is distinct from 'talvo-owner@example.invalid'
          ) or exists(
            select 1 from auth.users
            where id=current_setting('talvo_test.other_owner')::uuid
              and email is distinct from 'talvo-owner-2@example.invalid'
          ) then
            raise exception 'TALVO_FIXTURE_AUTH_NAMESPACE_COLLISION';
          end if;
        end
        $fixture_namespace_guard$;
        begin;
        alter table talvo.audit_events enable trigger talvo_audit_events_immutable;
        alter table talvo.audit_events disable trigger talvo_audit_events_immutable;
        alter table public.branch disable trigger trg_prevent_delete_last_branch;
        delete from talvo.audit_events where business_id=:'shop';
        delete from talvo.inventory_balances where business_id=:'shop';
        delete from talvo.ingredient_lots where business_id=:'shop';
        delete from talvo.ingredient_expiry_policy_versions where business_id=:'shop';
        delete from talvo.ingredient_expiry_policies where business_id=:'shop';
        delete from talvo.supply_items where business_id=:'shop';
        delete from talvo.command_executions where business_id=:'shop';
        delete from talvo.inventory_locations where business_id=:'shop';
        delete from public.shop_members
          where shop_id=:'shop' and user_id in (:'owner', :'other_owner');
        delete from public.branch
          where shop_id=:'shop' and id in (:'branch', :'other_branch');
        delete from public.shops
          where id=:'shop' and slug='talvo-supply-item-validation';
        delete from auth.users u
          where (
              (u.id=:'owner' and u.email='talvo-owner@example.invalid')
              or (u.id=:'other_owner' and u.email='talvo-owner-2@example.invalid')
            )
            and not exists(
              select 1 from public.shop_members sm where sm.user_id=u.id
            );
        alter table public.branch enable trigger trg_prevent_delete_last_branch;
        alter table talvo.audit_events enable trigger talvo_audit_events_immutable;
        commit;
        do $cleanup_verification$
        declare failures text[] := array[]::text[];
        begin
          if exists(select 1 from talvo.audit_events where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'audit_events'); end if;
          if exists(select 1 from talvo.inventory_balances where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'inventory_balances'); end if;
          if exists(select 1 from talvo.ingredient_lots where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'ingredient_lots'); end if;
          if exists(select 1 from talvo.ingredient_expiry_policy_versions where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'expiry_policy_versions'); end if;
          if exists(select 1 from talvo.ingredient_expiry_policies where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'expiry_policies'); end if;
          if exists(select 1 from talvo.supply_items where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'supply_items'); end if;
          if exists(select 1 from talvo.command_executions where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'command_executions'); end if;
          if exists(select 1 from talvo.inventory_locations where business_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'inventory_locations'); end if;
          if exists(select 1 from public.shops where id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'shops'); end if;
          if exists(select 1 from public.branch where shop_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'branch'); end if;
          if exists(select 1 from public.shop_members where shop_id=current_setting('talvo_test.shop')::uuid) then failures:=array_append(failures,'shop_members'); end if;
          if exists(select 1 from auth.users where id in (current_setting('talvo_test.owner')::uuid,current_setting('talvo_test.other_owner')::uuid)) then failures:=array_append(failures,'auth.users'); end if;
          if not exists(
            select 1 from pg_trigger
            where tgrelid='talvo.audit_events'::regclass
              and tgname='talvo_audit_events_immutable' and tgenabled='O'
          ) then failures:=array_append(failures,'audit immutable trigger disabled'); end if;
          if not exists(
            select 1 from pg_trigger
            where tgrelid='public.branch'::regclass
              and tgname='trg_prevent_delete_last_branch' and tgenabled='O'
          ) then failures:=array_append(failures,'last-branch trigger disabled'); end if;
          if cardinality(failures) <> 0 then
            raise exception 'TALVO fixture cleanup failed: %', array_to_string(failures,', ');
          end if;
          raise notice 'PASS TALVO deterministic fixture cleanup';
        end
        $cleanup_verification$;

    steps:
      - name: Require the exact protected TALVO target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "${APPROVED_TALVO_TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL protected target: talvo-staging must define APPROVED_TALVO_TARGET_SHA"
            exit 1
          }
          [[ "$TARGET_SHA" == "$APPROVED_TALVO_TARGET_SHA" ]] || {
            echo "FAIL protected target: target_sha is not the exact approved commit"
            exit 1
          }
          echo "PASS exact protected TALVO target approved"

      - name: Validate staging URL without connecting
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${STAGING_DATABASE_URL:-}" ]] || {
            echo "FAIL staging identity: STAGING_DATABASE_URL is not configured"
            exit 1
          }
          [[ "${EXPECTED_STAGING_PROJECT_REF:-}" =~ ^[a-z0-9]+$ ]] || {
            echo "FAIL staging identity: talvo-staging must define STAGING_PROJECT_REF"
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          parsed = urlparse(os.environ["STAGING_DATABASE_URL"])
          username = unquote(parsed.username or "")
          host = (parsed.hostname or "").lower()
          port = parsed.port or 5432
          database = parsed.path.lstrip("/")

          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("FAIL staging identity: URL is not PostgreSQL")
          if host == os.environ["REJECTED_PRODUCTION_HOST"]:
              raise SystemExit("FAIL staging identity: production host explicitly rejected")
          if host != os.environ["EXPECTED_STAGING_HOST"]:
              raise SystemExit("FAIL staging identity: host is not the approved staging endpoint")
          if port != 5432:
              raise SystemExit("FAIL staging identity: Session pooler port must be 5432")
          if database != "postgres":
              raise SystemExit("FAIL staging identity: database must be postgres")
          expected_username = "postgres." + os.environ["EXPECTED_STAGING_PROJECT_REF"]
          if username != expected_username:
              raise SystemExit("FAIL staging identity: project ref is not the approved staging project")

          print("PASS confirmed exact staging project; production rejected")
          PY
          echo "STAGING_IDENTITY_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Check out exact target as database input only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable database inputs and compute migration checksum
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || {
            echo "FAIL checked-out commit differs from target_sha"
            exit 1
          }
          [[ -f "$MIGRATION" && ! -L "$MIGRATION" ]]
          [[ -f "$INTEGRATION_TEST" && ! -L "$INTEGRATION_TEST" ]]
          [[ -f "$RECOVERY_MANIFEST_SQL" && ! -L "$RECOVERY_MANIFEST_SQL" ]]
          if grep -n '\\' "$MIGRATION"; then
            echo 'FAIL migration may not contain psql backslash commands'
            exit 1
          fi
          python3 - "$INTEGRATION_TEST" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_meta_commands = [
              r"\set ON_ERROR_STOP on",
              r"\if :{?talvo_business_id}",
              r"\else",
              r"\echo 'talvo_business_id is required'",
              r"\quit",
              r"\endif",
              r"\if :{?talvo_actor_id}",
              r"\else",
              r"\echo 'talvo_actor_id is required'",
              r"\quit",
              r"\endif",
              r"\gset",
              r"\echo 'TALVO CreateSupplyItem integration contract passed (transaction rolled back)'",
          ]
          found_meta_commands = []
          for line_number, line in enumerate(path.read_text().splitlines(), start=1):
              stripped = line.strip()
              if stripped.startswith("--"):
                  continue
              if "`" in line:
                  raise SystemExit(
                      f"FAIL integration test line {line_number}: psql backquote shell expansion is forbidden"
                  )
              if "\\" in line:
                  if not stripped.startswith("\\"):
                      raise SystemExit(
                          f"FAIL integration test line {line_number}: backslash is allowed only in an exact meta-command"
                      )
                  found_meta_commands.append(stripped)

          if found_meta_commands != expected_meta_commands:
              raise SystemExit(
                  "FAIL integration test psql meta-command sequence differs from the reviewed contract"
              )
          print("PASS integration test has the exact non-shell psql meta-command contract")
          PY
          sha256sum "$MIGRATION" "$INTEGRATION_TEST"
          migration_sha256="$(sha256sum "$MIGRATION" | awk '{print $1}')"
          [[ "$migration_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "TALVO_MIGRATION_SHA256=$migration_sha256" >> "$GITHUB_ENV"
          echo "PASS immutable database inputs; migration sha256=$migration_sha256"

      - name: Read-only staging preflight and migration-state classification
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql_staging() {
            docker run --rm -i -e DATABASE_URL="$STAGING_DATABASE_URL" "$POSTGRES_17_IMAGE" \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq'
          }
          check_true() {
            local label="$1" result
            result="$(printf '%s\n' "$2" | psql_staging)"
            [[ "$result" == "t" ]] || { echo "FAIL preflight: $label"; exit 1; }
            echo "PASS preflight: $label"
          }
          check_true "connection" "select current_database()='postgres' and inet_server_addr() is not null;"
          for table in shops branch shop_members; do
            check_true "public.$table exists" "select to_regclass('public.$table') is not null;"
          done
          check_true "auth.uid() exists" "select to_regprocedure('auth.uid()') is not null;"
          check_true "pgcrypto digest exists" "select to_regprocedure('extensions.digest(bytea,text)') is not null;"
          check_true "last-branch protection exists" "select exists(select 1 from pg_trigger where tgrelid='public.branch'::regclass and tgname='trg_prevent_delete_last_branch' and not tgisinternal);"

          state="$(cat <<'SQL' | psql_staging
          select concat_ws('|',
            (to_regnamespace('talvo') is not null)::text,
            (to_regclass('talvo.schema_revisions') is not null)::text,
            (to_regclass('talvo.supply_items') is not null)::text,
            (to_regclass('talvo.command_executions') is not null)::text,
            (to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is not null)::text,
            exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='branch' and column_name='is_active'
            )::text,
            (to_regclass('public.branch_shop_id_id_uidx') is not null)::text
          );
          SQL
          )"
          if [[ "$state" == "false|false|false|false|false|false|false" ]]; then
            baseline_manifest="$({
              cat <<'SQL'
          do $scope$
          begin
            perform set_config('talvo.manifest_scope','public-baseline',false);
          end
          $scope$;
          SQL
              cat "$RECOVERY_MANIFEST_SQL"
              cat <<'SQL'
          select object_count::text||'|'||manifest_sha256
          from talvo_recovery_manifest;
          SQL
            } | psql_staging)"
            [[ "$baseline_manifest" =~ ^[0-9]+\|[0-9a-f]{64}$ ]] || {
              echo "FAIL public baseline manifest: invalid result ($baseline_manifest)"
              exit 1
            }
            IFS='|' read -r baseline_count baseline_sha256 <<< "$baseline_manifest"
            echo "TALVO_PUBLIC_BASELINE_OBJECT_COUNT=$baseline_count" >> "$GITHUB_ENV"
            echo "TALVO_PUBLIC_BASELINE_SHA256=$baseline_sha256" >> "$GITHUB_ENV"
            echo "TALVO_MIGRATION_STATE=PRE_MIGRATION" >> "$GITHUB_ENV"
            echo "PASS migration state: PRE_MIGRATION; public baseline objects=$baseline_count sha256=$baseline_sha256"
          elif [[ "$state" == "true|true|true|true|true|true|true" ]]; then
            stored_sha256="$(printf "select coalesce((select source_sha256 from talvo.schema_revisions where version='%s'),'');\n" "$MIGRATION_VERSION" | psql_staging)"
            [[ "$stored_sha256" == "$TALVO_MIGRATION_SHA256" ]] || {
              echo "FAIL migration checksum: staging=$stored_sha256 target=$TALVO_MIGRATION_SHA256"
              exit 1
            }
            echo "TALVO_MIGRATION_STATE=FULLY_MIGRATED" >> "$GITHUB_ENV"
            echo "PASS migration state: FULLY_MIGRATED with exact source checksum"
          else
            echo "FAIL migration state: PARTIAL_OR_UNKNOWN ($state)"
            exit 1
          fi

      - name: Apply TALVO migration in one transaction
        if: env.TALVO_MIGRATION_STATE == 'PRE_MIGRATION'
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "TALVO_MIGRATION_ATTEMPTED_THIS_RUN=true" >> "$GITHUB_ENV"
          migration_manifest="$({
            cat "$MIGRATION"
            printf '\n'
            cat <<'SQL'
          insert into talvo.schema_revisions(version, source_sha256)
          values (:'migration_version', :'migration_sha256');
          do $scope$
          begin
            perform set_config('talvo.manifest_scope','talvo-post',false);
          end
          $scope$;
          SQL
            cat "$RECOVERY_MANIFEST_SQL"
            cat <<'SQL'
          select object_count::text||'|'||manifest_sha256
          from talvo_recovery_manifest;
          SQL
          } | docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e MIGRATION_VERSION \
            -e TALVO_MIGRATION_SHA256 \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction \
              -Atq \
              -v migration_version="$MIGRATION_VERSION" \
              -v migration_sha256="$TALVO_MIGRATION_SHA256"')"
          migration_manifest="$(printf '%s\n' "$migration_manifest" | tail -n1)"
          [[ "$migration_manifest" =~ ^[0-9]+\|[0-9a-f]{64}$ ]] || {
            echo "FAIL TALVO recovery manifest: invalid result ($migration_manifest)"
            exit 1
          }
          IFS='|' read -r schema_count schema_sha256 <<< "$migration_manifest"
          echo "TALVO_RECOVERY_OBJECT_COUNT=$schema_count" >> "$GITHUB_ENV"
          echo "TALVO_RECOVERY_MANIFEST_SHA256=$schema_sha256" >> "$GITHUB_ENV"
          echo "PASS migration, source checksum, and recovery manifest committed atomically; objects=$schema_count sha256=$schema_sha256"

      - name: Verify canonical schema, security, and constraints
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e MIGRATION_VERSION \
            -e TALVO_MIGRATION_SHA256 \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq \
              -v migration_version="$MIGRATION_VERSION" \
              -v migration_sha256="$TALVO_MIGRATION_SHA256"' <<'SQL'
          select set_config('talvo.verify_migration_version', :'migration_version', false);
          select set_config('talvo.verify_migration_sha256', :'migration_sha256', false);
          do $verify$
          declare
            failures text[] := array[]::text[];
            checked_table_name text;
          begin
            foreach checked_table_name in array array[
              'schema_revisions','units','role_capabilities','command_executions','supply_items',
              'ingredient_expiry_policies','ingredient_expiry_policy_versions',
              'ingredient_lots','inventory_locations','inventory_balances','audit_events'
            ] loop
              if to_regclass(format('talvo.%I',checked_table_name)) is null then
                failures:=array_append(failures,'missing table '||checked_table_name);
              elsif not (select c.relrowsecurity from pg_class c where c.oid=format('talvo.%I',checked_table_name)::regclass) then
                failures:=array_append(failures,'RLS disabled '||checked_table_name);
              end if;
            end loop;

            if to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is null then
              failures:=array_append(failures,'CreateSupplyItem RPC missing');
            elsif not (
              select p.prosecdef and coalesce(p.proconfig,'{}') @> array['search_path=pg_catalog, pg_temp']
              from pg_proc p
              where p.oid='public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)'::regprocedure
            ) then
              failures:=array_append(failures,'CreateSupplyItem RPC not hardened');
            end if;

            if not has_function_privilege('authenticated','public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)','execute')
               or has_function_privilege('anon','public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)','execute')
               or has_function_privilege('service_role','public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)','execute') then
              failures:=array_append(failures,'CreateSupplyItem RPC ACL mismatch');
            end if;

            if has_schema_privilege('anon','talvo','usage')
               or has_schema_privilege('authenticated','talvo','usage')
               or has_schema_privilege('service_role','talvo','usage') then
              failures:=array_append(failures,'direct talvo schema access exposed');
            end if;

            if not exists(
              select 1 from information_schema.columns isc
              where isc.table_schema='public' and isc.table_name='branch' and isc.column_name='is_active'
                and isc.is_nullable='NO' and isc.column_default in ('false','false::boolean')
            ) then failures:=array_append(failures,'branch is_active is not fail-closed'); end if;

            if (select count(*) from talvo.units where symbol in ('ml','g','piece')) <> 3 then
              failures:=array_append(failures,'canonical unit seed incomplete');
            end if;

            if not exists(
              select 1 from talvo.schema_revisions sr
              where sr.version=current_setting('talvo.verify_migration_version')
                and sr.source_sha256=current_setting('talvo.verify_migration_sha256')
            ) then failures:=array_append(failures,'migration source checksum mismatch'); end if;

            if not exists(
              select 1 from pg_trigger
              where tgrelid='public.branch'::regclass
                and tgname='talvo_supply_item_integrity_from_branch'
                and tgdeferrable and tginitdeferred
            ) then failures:=array_append(failures,'branch integrity trigger missing'); end if;

            if not exists(
              select 1 from pg_constraint
              where conrelid='talvo.command_executions'::regclass
                and conname='talvo_command_executions_business_fk'
                and condeferrable and condeferred
            ) then failures:=array_append(failures,'execution business FK is not deferred'); end if;

            if cardinality(failures) <> 0 then
              raise exception 'TALVO structural verification failed: %', array_to_string(failures,', ');
            end if;
            raise notice 'PASS TALVO schema, ACL, RLS, branch fail-close, and deferred constraints';
          end
          $verify$;
          SQL
          echo "TALVO_CLEANUP_ARMED=true" >> "$GITHUB_ENV"
          echo "PASS cleanup armed only after exact schema verification"

      - name: Pre-clean deterministic TALVO fixtures
