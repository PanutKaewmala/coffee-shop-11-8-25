          }

      - name: Run TALVO idempotency and namespace concurrency races
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          terminate_background_jobs() {
            local running
            running="$(jobs -pr || true)"
            if [[ -n "$running" ]]; then
              kill $running 2>/dev/null || true
            fi
          }
          trap terminate_background_jobs EXIT
          psql_file() {
            docker run --rm -i \
              -e DATABASE_URL="$STAGING_DATABASE_URL" \
              -e PGOPTIONS="$TALVO_DB_PGOPTIONS" \
              "$POSTGRES_17_IMAGE" \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' < "$1"
          }
          scalar() {
            printf '%s\n' "$1" | docker run --rm -i \
              -e DATABASE_URL="$STAGING_DATABASE_URL" \
              -e PGOPTIONS="$TALVO_DB_PGOPTIONS" \
              "$POSTGRES_17_IMAGE" \
              sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq'
          }
          wait_pair() {
            local label="$1" first_pid="$2" second_pid="$3" first_status second_status
            set +e
            wait "$first_pid"; first_status=$?
            wait "$second_pid"; second_status=$?
            set -e
            [[ "$first_status" -eq 0 && "$second_status" -eq 0 ]] || {
              echo "FAIL $label process status: $first_status,$second_status"
              exit 1
            }
          }
          wait_until_true() {
            local label="$1" sql="$2" attempt
            for attempt in {1..40}; do
              if [[ "$(scalar "$sql")" == 't' ]]; then
                return 0
              fi
              sleep 0.25
            done
            echo "FAIL timed out waiting for $label"
            exit 1
          }
          command_sql() {
            local actor="$1" key="$2" name="$3"
            printf "set role authenticated;\n"
            printf "select set_config('request.jwt.claim.sub','%s',false);\n" "$actor"
            printf "select public.create_talvo_supply_item('%s','%s','10000000-0000-4000-8000-000000000001',0.001,false,'NON_EXPIRING','%s')::text;\n" \
              "$SHOP_ID" "$name" "$key"
          }

          cat > "$work/revocation-holder.sql" <<SQL
          begin;
          set local application_name='talvo-revocation-holder';
          select id from public.shops where id='$SHOP_ID' for update;
          select pg_sleep(12);
          commit;
          SQL
          psql_file "$work/revocation-holder.sql" > "$work/revocation-holder.out" & holder_pid=$!
          wait_until_true 'business-lock holder' "select exists(
            select 1 from pg_stat_activity
            where application_name='talvo-revocation-holder'
              and state='active' and query like '%pg_sleep(12)%'
          );"

          {
            printf "set application_name='talvo-revocation-command';\n"
            command_sql "$OWNER_ID" 'talvo-revocation-race' 'TALVO revocation race'
          } > "$work/revocation-command.sql"
          psql_file "$work/revocation-command.sql" > "$work/revocation-command.out" & command_pid=$!
          wait_until_true 'command blocked after authorization' "select exists(
            select 1 from pg_stat_activity
            where application_name='talvo-revocation-command' and wait_event_type='Lock'
          );"

          cat > "$work/revocation-downgrade.sql" <<SQL
          set application_name='talvo-revocation-downgrade';
          update public.shop_members
          set role='staff'
          where shop_id='$SHOP_ID' and user_id='$OWNER_ID';
          SQL
          psql_file "$work/revocation-downgrade.sql" > "$work/revocation-downgrade.out" & downgrade_pid=$!
          wait_until_true 'concurrent downgrade blocked by authorization lock' "select exists(
            select 1 from pg_stat_activity
            where application_name='talvo-revocation-downgrade' and wait_event_type='Lock'
          );"

          set +e
          wait "$holder_pid"; holder_status=$?
          wait "$command_pid"; command_status=$?
          wait "$downgrade_pid"; downgrade_status=$?
          set -e
          [[ "$holder_status" -eq 0 && "$command_status" -eq 0 && "$downgrade_status" -eq 0 ]] || {
            echo "FAIL revocation race process status: $holder_status,$command_status,$downgrade_status"
            exit 1
          }
          [[ "$(tail -n1 "$work/revocation-command.out" | jq -r '.ok')" == 'true' ]] || {
            echo 'FAIL command that linearized before revocation did not commit'
            exit 1
          }
          [[ "$(scalar "select role from public.shop_members where shop_id='$SHOP_ID' and user_id='$OWNER_ID';")" == 'staff' ]] || {
            echo 'FAIL concurrent downgrade did not commit after the command'
            exit 1
          }
          scalar "update public.shop_members set role='owner' where shop_id='$SHOP_ID' and user_id='$OWNER_ID';" >/dev/null
          echo 'PASS authorization is linearizable against a concurrent membership downgrade'

          command_sql "$OWNER_ID" 'talvo-race-same-key' 'TALVO race same key' > "$work/same-1.sql"
          cp "$work/same-1.sql" "$work/same-2.sql"
          psql_file "$work/same-1.sql" > "$work/same-1.out" & p1=$!
          psql_file "$work/same-2.sql" > "$work/same-2.out" & p2=$!
          wait_pair 'same-key race' "$p1" "$p2"
          cmp -s "$work/same-1.out" "$work/same-2.out" || {
            echo 'FAIL same-key race returned different responses'
            exit 1
          }
          evidence="$(scalar "select
            (select count(*) from talvo.supply_items where business_id='$SHOP_ID' and name='TALVO race same key')||','||
            (select count(*) from talvo.ingredient_lots lot join talvo.supply_items si on si.id=lot.supply_item_id where si.business_id='$SHOP_ID' and si.name='TALVO race same key')||','||
            (select count(*) from talvo.audit_events ae join talvo.command_executions ce on ce.business_id=ae.business_id and ce.id=ae.command_execution_id where ce.business_id='$SHOP_ID' and ce.idempotency_key='talvo-race-same-key')||','||
            (select count(*) from talvo.command_executions where business_id='$SHOP_ID' and idempotency_key='talvo-race-same-key' and status='SUCCEEDED');")"
          [[ "$evidence" == '1,2,1,1' ]] || { echo "FAIL same-key evidence: $evidence"; exit 1; }
          echo "PASS same-key concurrency: item,lots,audit,execution=$evidence"

          command_sql "$OTHER_OWNER_ID" 'talvo-race-same-key' 'TALVO race same key' > "$work/other-actor.sql"
          psql_file "$work/other-actor.sql" > "$work/other-actor.out"
          [[ "$(tail -n1 "$work/other-actor.out" | jq -r '.error.code')" == 'IDEMPOTENCY_CONFLICT' ]] || {
            echo 'FAIL same key from a different actor was not rejected'
            exit 1
          }
          echo 'PASS actor identity participates in request hash'

          scalar "update public.shop_members set role='staff' where shop_id='$SHOP_ID' and user_id='$OWNER_ID';" >/dev/null
          command_sql "$OWNER_ID" 'talvo-race-same-key' 'TALVO race same key' > "$work/replay-forbidden.sql"
          psql_file "$work/replay-forbidden.sql" > "$work/replay-forbidden.out"
          [[ "$(tail -n1 "$work/replay-forbidden.out" | jq -r '.error.code')" == 'FORBIDDEN' ]] || {
            echo 'FAIL replay bypassed current authorization'
            exit 1
          }
          scalar "update public.shop_members set role='owner' where shop_id='$SHOP_ID' and user_id='$OWNER_ID';" >/dev/null
          echo 'PASS replay reauthorizes the current actor'

          command_sql "$OWNER_ID" 'talvo-name-race-a' 'TALVO namespace race' > "$work/name-a.sql"
          command_sql "$OTHER_OWNER_ID" 'talvo-name-race-b' 'TALVO namespace race' > "$work/name-b.sql"
          psql_file "$work/name-a.sql" > "$work/name-a.out" & p1=$!
          psql_file "$work/name-b.sql" > "$work/name-b.out" & p2=$!
          wait_pair 'same-name different-key race' "$p1" "$p2"
          evidence="$(scalar "select
            (select count(*) from talvo.supply_items where business_id='$SHOP_ID' and name='TALVO namespace race')||','||
            (select count(*) from talvo.command_executions where business_id='$SHOP_ID' and idempotency_key in ('talvo-name-race-a','talvo-name-race-b') and status='SUCCEEDED')||','||
            (select count(*) from talvo.command_executions where business_id='$SHOP_ID' and idempotency_key in ('talvo-name-race-a','talvo-name-race-b') and status='FAILED');")"
          [[ "$evidence" == '1,1,1' ]] || { echo "FAIL namespace race evidence: $evidence"; exit 1; }
          echo "PASS same-name different-key race: item,succeeded,failed=$evidence"

      - name: Clean up all TALVO staging fixtures
        if: always()
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ "${STAGING_IDENTITY_VALIDATED:-}" != 'true' ]]; then
            echo 'Cleanup skipped: staging identity was not validated'
            exit 0
          fi
          if [[ "${TALVO_CLEANUP_ARMED:-}" != 'true' ]]; then
            echo 'Cleanup skipped: exact TALVO schema was not verified'
            exit 0
          fi
          printf '%s\n' "$TALVO_FIXTURE_CLEANUP_SQL" | docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            -e SHOP_ID -e BRANCH_ID -e OTHER_BRANCH_ID -e OWNER_ID -e OTHER_OWNER_ID \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -v shop="$SHOP_ID" -v branch="$BRANCH_ID" -v other_branch="$OTHER_BRANCH_ID" \
              -v owner="$OWNER_ID" -v other_owner="$OTHER_OWNER_ID"'
          echo "PASS cleanup: TALVO fixture shop $SHOP_ID removed"

      - name: Recover a migration applied by this failed run
        if: ${{ always() && env.TALVO_MIGRATION_ATTEMPTED_THIS_RUN == 'true' && (failure() || cancelled()) }}
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ "${STAGING_IDENTITY_VALIDATED:-}" == 'true' ]] || {
            echo "FAIL recovery refused: staging identity was not validated"
            exit 1
          }

          state="$(docker run --rm -i \
            -e DATABASE_URL="$STAGING_DATABASE_URL" \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq' <<'SQL'
          select concat_ws('|',
            (to_regnamespace('talvo') is not null)::text,
            (to_regclass('talvo.schema_revisions') is not null)::text,
            (to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is not null)::text,
            exists(
              select 1 from information_schema.columns
              where table_schema='public' and table_name='branch' and column_name='is_active'
            )::text,
            (to_regclass('public.branch_shop_id_id_uidx') is not null)::text,
            exists(
              select 1 from pg_trigger
              where tgrelid='public.branch'::regclass
                and tgname='talvo_supply_item_integrity_from_branch'
            )::text
          );
          SQL
          )"

          if [[ "$state" == "false|false|false|false|false|false" ]]; then
            echo "PASS recovery: failed migration transaction left no TALVO state"
            exit 0
          fi
          [[ "$state" == "true|true|true|true|true|true" ]] || {
            echo "FAIL recovery refused: TALVO state is partial or externally modified ($state)"
            exit 1
          }

          [[ "${TALVO_RECOVERY_OBJECT_COUNT:-}" =~ ^[0-9]+$ ]]
          [[ "${TALVO_RECOVERY_MANIFEST_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${TALVO_PUBLIC_BASELINE_OBJECT_COUNT:-}" =~ ^[0-9]+$ ]]
          [[ "${TALVO_PUBLIC_BASELINE_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]

          {
            cat <<'SQL'
          begin;
          lock table
            public.shops,
            public.branch,
            public.shop_members,
            auth.users,
            talvo.schema_revisions,
            talvo.units,
            talvo.role_capabilities,
            talvo.command_executions,
            talvo.supply_items,
            talvo.ingredient_expiry_policies,
            talvo.ingredient_expiry_policy_versions,
            talvo.ingredient_lots,
            talvo.inventory_locations,
            talvo.inventory_balances,
            talvo.audit_events
          in access exclusive mode;
          SQL
            cat "$RECOVERY_MANIFEST_SQL"
            cat <<'SQL'
          select set_config('talvo.recovery_shop', :'shop', false);
          select set_config('talvo.recovery_branch', :'branch', false);
          select set_config('talvo.recovery_other_branch', :'other_branch', false);
          select set_config('talvo.recovery_owner', :'owner', false);
          select set_config('talvo.recovery_other_owner', :'other_owner', false);
          select set_config('talvo.recovery_version', :'migration_version', false);
          select set_config('talvo.recovery_sha256', :'migration_sha256', false);
          select set_config('talvo.recovery_object_count', :'recovery_object_count', false);
          select set_config('talvo.recovery_manifest_sha256', :'recovery_manifest_sha256', false);
          select set_config('talvo.public_baseline_object_count', :'baseline_object_count', false);
          select set_config('talvo.public_baseline_sha256', :'baseline_sha256', false);

          do $guard$
          declare
            current_object_count bigint;
            current_manifest_sha256 text;
          begin
            if (select count(*) from talvo.schema_revisions) <> 1
               or not exists(
                 select 1
                 from talvo.schema_revisions
                 where version=current_setting('talvo.recovery_version')
                   and source_sha256=current_setting('talvo.recovery_sha256')
               ) then
              raise exception 'RECOVERY_REVISION_CHANGED';
            end if;

            perform set_config('talvo.manifest_scope','talvo-post',true);
            select object_count,manifest_sha256
            into current_object_count,current_manifest_sha256
            from talvo_recovery_manifest;
            if current_object_count::text<>current_setting('talvo.recovery_object_count')
               or current_manifest_sha256<>current_setting('talvo.recovery_manifest_sha256') then
              raise exception 'RECOVERY_REFUSED_TALVO_MANIFEST_MISMATCH count=% sha256=%',
                current_object_count,current_manifest_sha256;
            end if;

            perform set_config('talvo.manifest_scope','public-baseline',true);
            select object_count,manifest_sha256
            into current_object_count,current_manifest_sha256
            from talvo_recovery_manifest;
            if current_object_count::text<>current_setting('talvo.public_baseline_object_count')
               or current_manifest_sha256<>current_setting('talvo.public_baseline_sha256') then
              raise exception 'RECOVERY_REFUSED_PUBLIC_BASELINE_MISMATCH count=% sha256=%',
                current_object_count,current_manifest_sha256;
            end if;

            if (select count(*) from talvo.units) <> 3
               or (
                 select count(*)
                 from talvo.units
                 where (id,dimension,symbol,decimal_scale) in (
                   ('10000000-0000-4000-8000-000000000001'::uuid,'VOLUME','ml',3),
                   ('10000000-0000-4000-8000-000000000002'::uuid,'MASS','g',3),
                   ('10000000-0000-4000-8000-000000000003'::uuid,'COUNT','piece',0)
                 )
               ) <> 3
               or (select count(*) from talvo.role_capabilities) <> 1
               or not exists(
                 select 1
                 from talvo.role_capabilities
                 where role='owner' and capability='inventory.supply_item.create'
               ) then
              raise exception 'RECOVERY_REFUSED_MODIFIED_CANONICAL_DATA';
            end if;

            if exists(
              select 1 from talvo.command_executions where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.supply_items where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.ingredient_expiry_policies where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.ingredient_expiry_policy_versions where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.ingredient_lots where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.inventory_locations where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.inventory_balances where business_id<>current_setting('talvo.recovery_shop')::uuid
              union all select 1 from talvo.audit_events where business_id<>current_setting('talvo.recovery_shop')::uuid
            ) then
              raise exception 'RECOVERY_REFUSED_NON_FIXTURE_TALVO_DATA';
            end if;

            if exists(
              select 1 from public.shops
              where id=current_setting('talvo.recovery_shop')::uuid
                and (
                  slug is distinct from 'talvo-supply-item-validation'
                  or name is distinct from 'TALVO staging validation'
                )
            ) then
              raise exception 'RECOVERY_REFUSED_FIXTURE_SHOP_ID_COLLISION';
            end if;
            if exists(
              select 1 from public.branch
              where id in (
                current_setting('talvo.recovery_branch')::uuid,
                current_setting('talvo.recovery_other_branch')::uuid
              )
                and shop_id<>current_setting('talvo.recovery_shop')::uuid
            ) or exists(
              select 1 from public.branch
              where shop_id=current_setting('talvo.recovery_shop')::uuid
                and id not in (
                  current_setting('talvo.recovery_branch')::uuid,
                  current_setting('talvo.recovery_other_branch')::uuid
                )
            ) then
              raise exception 'RECOVERY_REFUSED_FIXTURE_BRANCH_NAMESPACE_COLLISION';
