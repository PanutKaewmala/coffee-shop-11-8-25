name: Apply TALVO production rollout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_TALVO_PRODUCTION"
        required: true
        type: string
      target_sha:
        description: "Exact approved PR commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: talvo-production-database-rollout
  cancel-in-progress: false

env:
  TRUSTED_ROLLOUT_BASE_SHA: be51e0f0b7541ef2f2a8dd63c8df0bfeb43be79b
  PRODUCTION_PROJECT_REF: udgxrvtbhytqncmyhmiv
  STAGING_PROJECT_REF: vgsrqrirtxxxnccactsb
  POSTGRES_17_IMAGE: postgres:17.11-trixie@sha256:f86c774c7a51d0f05133f2ab70e4c384b589170458ab1df1ba83426d7cc30da7

jobs:
  verify-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
    steps:
      - name: Require trusted main dispatch
        id: guard
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          RAW_CONFIRMATION: ${{ inputs.confirmation }}
          RAW_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          confirmation="$(trim "$RAW_CONFIRMATION")"
          target_sha="$(trim "$RAW_TARGET_SHA")"
          [[ "$REF_NAME" == "main" ]] || { echo "::error::Dispatch branch must be main"; exit 1; }
          [[ "$confirmation" == "APPLY_TALVO_PRODUCTION" ]] || { echo "::error::Confirmation mismatch"; exit 1; }
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be 40 lowercase hex characters"; exit 1; }
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.guard.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target and migration set
        shell: bash
        env:
          TARGET_SHA: ${{ steps.guard.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "::error::Checkout differs from target SHA"; exit 1; }
          git cat-file -e "$TRUSTED_ROLLOUT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$TRUSTED_ROLLOUT_BASE_SHA" "$TARGET_SHA" || {
            echo "::error::Target must descend from reviewed rollout base"
            exit 1
          }
          migrations=(
            supabase/migrations/20260807090000_atomic_pos_checkout.sql
            supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql
            supabase/migrations/20260922193511_bootstrap_pre_talvo_branches.sql
            supabase/migrations/20260819180000_talvo_receive_supply_item.sql
            supabase/migrations/20260819180100_talvo_receive_history_hardening.sql
            supabase/migrations/20260910042652_sale_recipe_inventory.sql
            supabase/migrations/20260921142010_current_usable_stock.sql
          )
          for f in "${migrations[@]}"; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::Missing migration: $f"; exit 1; }
            ! grep -Eiq '^\s*(commit|rollback)\s*;' "$f" || {
              echo "::error::Migration contains transaction control: $f"
              exit 1
            }
            ! grep -Eiq '\bCREATE\s+(UNIQUE\s+)?INDEX\s+CONCURRENTLY\b' "$f" || {
              echo "::error::Migration contains CREATE INDEX CONCURRENTLY: $f"
              exit 1
            }
          done
          grep -Fq "Review only: do not apply to staging or production from this repository task."             supabase/migrations/20260807090000_atomic_pos_checkout.sql || {
              echo "::error::Atomic POS review-only marker missing"
              exit 1
            }

  apply-production:
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: talvo-production
    env:
      APPROVED_TALVO_TARGET_SHA: ${{ vars.APPROVED_TALVO_TARGET_SHA }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      TARGET_SHA: ${{ needs.verify-target.outputs.target_sha }}
    steps:
      - name: Require exact approved target and production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_TALVO_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::APPROVED_TALVO_TARGET_SHA missing or invalid"; exit 1; }
          [[ "$TARGET_SHA" == "$APPROVED_TALVO_TARGET_SHA" ]] || { echo "::error::Target SHA is not the protected approved SHA"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse
          p = urlparse(os.environ["PRODUCTION_DATABASE_URL"])
          project_ref = os.environ["PRODUCTION_PROJECT_REF"]
          staging_ref = os.environ["STAGING_PROJECT_REF"]
          host = (p.hostname or "").lower()
          user = unquote(p.username or "")
          if p.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("FAIL production URL scheme")
          if staging_ref in host or staging_ref in user:
              raise SystemExit("FAIL staging project supplied as production")
          if host == f"db.{project_ref}.supabase.co":
              if user != "postgres" or (p.port or 5432) != 5432:
                  raise SystemExit("FAIL direct production identity")
          elif host == "aws-1-ap-southeast-1.pooler.supabase.com":
              if user != f"postgres.{project_ref}" or (p.port or 5432) != 5432:
                  raise SystemExit("FAIL pooler production identity")
          else:
              raise SystemExit(f"FAIL unexpected production host: {host}")
          PY
          echo "TALVO_IDENTITY_VALIDATED=true" >> "$GITHUB_ENV"

      - name: Check out exact target as rollout input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-target.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck pre-TALVO production state read-only
        shell: bash
        run: |
          set -euo pipefail
          result="$(docker run --rm -i             -e DATABASE_URL="$PRODUCTION_DATABASE_URL"             -e PGOPTIONS="-c default_transaction_read_only=on"             "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select
            (to_regnamespace('talvo') is null)::text,
            (not exists(select 1 from information_schema.columns where table_schema='public' and table_name='branch' and column_name='is_active'))::text,
            (not exists(select 1 from information_schema.columns where table_schema='public' and table_name='pos_idempotency' and column_name='request_hash'))::text,
            (to_regprocedure('public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)') is null)::text,
            (not exists(select 1 from information_schema.columns where table_schema='public' and table_name='recipe_items' and column_name='supply_item_id'))::text,
            (to_regclass('supabase_migrations.schema_migrations') is null)::text,
            (select count(*) from public.branch where shop_id is null),
            (select count(*) from (select shop_id,id from public.branch group by shop_id,id having count(*)>1) x),
            (select count(*) from (select shop_id,key from public.pos_idempotency group by shop_id,key having count(*)>1) x),
            (select count(*) from public.recipe_items r where r.quantity is null or r.quantity<=0),
            (select count(*) from public.recipe_items r where not exists (
              select 1 from public.ingredients i where i.id=r.ingredient_id and i.shop_id=r.shop_id
            )),
            (select count(*) from public.recipe_items r where exists (
              select 1 from public.ingredients i where i.id=r.ingredient_id and i.shop_id=r.shop_id and i.branch_id is null
            )),
            (select count(*) from public.recipe_items r where not exists (
              select 1 from public.menu_variants v where v.id=r.variant_id and v.shop_id=r.shop_id
            )),
            (select count(*) from public.recipe_items r where exists (
              select 1 from public.ingredients i where i.id=r.ingredient_id and i.shop_id=r.shop_id
                and (not i.is_active or i.archived_at is not null)
            ));
          SQL
          )"
          expected="true|true|true|true|true|true|0|0|0|0|0|0|0|0"
          [[ "$result" == "$expected" ]] || { echo "::error::Production preconditions changed: $result"; exit 1; }
          counts="$(docker run --rm -i \
            -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            -e PGOPTIONS="-c default_transaction_read_only=on" \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select
            (select count(*) from public.shops),
            (select count(*) from public.branch),
            (select count(*) from public.shop_members),
            (select count(*) from public.recipe_items),
            (select count(*) from public.orders),
            (select count(*) from public.order_items),
            (select count(*) from public.pos_idempotency),
            (select count(*) from public.daily_closes),
            (select count(*) from public.cash_movements);
          SQL
          )"
          [[ "$counts" =~ ^[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+\|[0-9]+$ ]] || {
            echo "::error::Invalid production count snapshot: $counts"
            exit 1
          }
          echo "TALVO_EXPECTED_COUNTS=$counts" >> "$GITHUB_ENV"
          echo "TALVO_PRESTATE_CONFIRMED=true" >> "$GITHUB_ENV"

      - name: Build committed rollout transaction
        shell: bash
        run: |
          set -euo pipefail
          A=supabase/migrations/20260807090000_atomic_pos_checkout.sql
          B=supabase/migrations/20260817100000_talvo_supply_item_vertical_slice.sql
          C=supabase/migrations/20260922193511_bootstrap_pre_talvo_branches.sql
          D=supabase/migrations/20260819180000_talvo_receive_supply_item.sql
          E=supabase/migrations/20260819180100_talvo_receive_history_hardening.sql
          F=supabase/migrations/20260910042652_sale_recipe_inventory.sql
          G=supabase/migrations/20260921142010_current_usable_stock.sql

          for pair in             "20260807090000:$A:sha_atomic"             "20260817100000:$B:sha_baseline"             "20260922193511:$C:sha_bootstrap"             "20260819180000:$D:sha_receive"             "20260819180100:$E:sha_hardening"             "20260910042652:$F:sha_sale"             "20260921142010:$G:sha_usable"; do
            IFS=: read -r version file var <<< "$pair"
            printf -v "$var" '%s' "$(sha256sum "$file" | awk '{print $1}')"
          done

          cat > /tmp/talvo-production-rollout.sql <<'SQL'
          \set ON_ERROR_STOP on
          set transaction isolation level read committed;
          set local lock_timeout = '3s';
          set local statement_timeout = '180s';

          create temporary table rollout_before_counts(
            shops bigint, branches bigint, members bigint, recipe_items bigint,
            orders bigint, order_items bigint, pos_idempotency bigint,
            daily_closes bigint, cash_movements bigint
          ) on commit drop;
          insert into rollout_before_counts
          select
            (select count(*) from public.shops),
            (select count(*) from public.branch),
            (select count(*) from public.shop_members),
            (select count(*) from public.recipe_items),
            (select count(*) from public.orders),
            (select count(*) from public.order_items),
            (select count(*) from public.pos_idempotency),
            (select count(*) from public.daily_closes),
            (select count(*) from public.cash_movements);

          lock table public.shops, public.branch, public.shop_members, public.ingredients,
            public.recipe_items, public.menu_variants, public.orders, public.order_items,
            public.pos_idempotency, public.daily_closes, public.cash_movements
            in share row exclusive mode nowait;
          SQL

          cat "$A" >> /tmp/talvo-production-rollout.sql
          cat "$B" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values
            ('20260807090000','$sha_atomic'),
            ('20260817100000','$sha_baseline');
          SQL

          cat "$C" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values ('20260922193511','$sha_bootstrap');
          SQL
          cat "$D" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values ('20260819180000','$sha_receive');
          SQL
          cat "$E" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values ('20260819180100','$sha_hardening');
          SQL
          cat "$F" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values ('20260910042652','$sha_sale');
          SQL
          cat "$G" >> /tmp/talvo-production-rollout.sql
          cat >> /tmp/talvo-production-rollout.sql <<SQL
          insert into talvo.schema_revisions(version,source_sha256) values ('20260921142010','$sha_usable');
          SQL

          cat >> /tmp/talvo-production-rollout.sql <<'SQL'
          do $verify$
          declare branch_count bigint;
          begin
            if (select shops from rollout_before_counts) <> (select count(*) from public.shops)
              or (select branches from rollout_before_counts) <> (select count(*) from public.branch)
              or (select members from rollout_before_counts) <> (select count(*) from public.shop_members)
              or (select recipe_items from rollout_before_counts) <> (select count(*) from public.recipe_items)
              or (select orders from rollout_before_counts) <> (select count(*) from public.orders)
              or (select order_items from rollout_before_counts) <> (select count(*) from public.order_items)
              or (select pos_idempotency from rollout_before_counts) <> (select count(*) from public.pos_idempotency)
              or (select daily_closes from rollout_before_counts) <> (select count(*) from public.daily_closes)
              or (select cash_movements from rollout_before_counts) <> (select count(*) from public.cash_movements)
            then raise exception 'ROLLOUT_CHANGED_EXISTING_ROW_COUNTS'; end if;

            select count(*) into branch_count from public.branch;
            if (select count(*) from public.branch where is_active) <> branch_count then
              raise exception 'ROLLOUT_BRANCH_ACTIVATION_INCOMPLETE';
            end if;
            if (select count(*) from talvo.inventory_locations) <> branch_count * 2 then
              raise exception 'ROLLOUT_CANONICAL_LOCATION_COUNT';
            end if;
            if exists(
              select 1 from public.branch b
              cross join (values ('BRANCH_AVAILABLE'),('BRANCH_QUARANTINE')) k(kind)
              where (select count(*) from talvo.inventory_locations l
                where l.business_id=b.shop_id and l.branch_id=b.id and l.kind=k.kind) <> 1
            ) then raise exception 'ROLLOUT_CANONICAL_LOCATION_INVARIANT'; end if;
            if exists(select 1 from talvo.supply_items) then raise exception 'ROLLOUT_UNEXPECTED_SUPPLY_ITEMS'; end if;
            if (select count(*) from talvo.schema_revisions) <> 7 then raise exception 'ROLLOUT_LEDGER_COUNT'; end if;
            if exists(select 1 from public.recipe_items where branch_id is null) then raise exception 'ROLLOUT_RECIPE_BRANCH_BACKFILL_INCOMPLETE'; end if;
            if to_regprocedure('public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)') is null
              or to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is null
              or to_regprocedure('public.get_recipe_usable_stock(uuid,uuid)') is null
              or to_regprocedure('public.set_recipe_stock_minimum(uuid,uuid,text,uuid,numeric)') is null
              or to_regclass('talvo.branch_stock_minimums') is null
            then raise exception 'ROLLOUT_REQUIRED_CONTRACT_MISSING'; end if;
          end
          $verify$;
          \echo PASS TALVO production rollout transaction verified before commit
          SQL

          printf '%s
'             "20260807090000|$sha_atomic"             "20260817100000|$sha_baseline"             "20260922193511|$sha_bootstrap"             "20260819180000|$sha_receive"             "20260819180100|$sha_hardening"             "20260910042652|$sha_sale"             "20260921142010|$sha_usable"             > /tmp/talvo-expected-revisions.txt

      - name: Apply rollout in one transaction
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm -i             -e DATABASE_URL="$PRODUCTION_DATABASE_URL"             -v /tmp/talvo-production-rollout.sql:/runtime.sql:ro             "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f /runtime.sql')"
          printf '%s
' "$output"
          [[ "$(printf '%s
' "$output" | tail -n1)" == "PASS TALVO production rollout transaction verified before commit" ]] || {
            echo "::error::Rollout completion marker missing"
            exit 1
          }
          echo "TALVO_ROLLOUT_APPLIED=true" >> "$GITHUB_ENV"

      - name: Verify committed production state
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -r expected_shops expected_branches expected_members expected_recipes expected_orders expected_order_items expected_pos expected_closes expected_cash <<< "$TALVO_EXPECTED_COUNTS"
          expected_locations=$((expected_branches * 2))
          state="$(docker run --rm -i \
            -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            -e PGOPTIONS="-c default_transaction_read_only=on" \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select
            (to_regnamespace('talvo') is not null)::text,
            (exists(select 1 from information_schema.columns where table_schema='public' and table_name='branch' and column_name='is_active'))::text,
            (exists(select 1 from information_schema.columns where table_schema='public' and table_name='pos_idempotency' and column_name='request_hash'))::text,
            (to_regprocedure('public.process_pos_checkout_atomic(uuid,uuid,jsonb,text,numeric,text)') is not null)::text,
            (to_regprocedure('public.create_talvo_supply_item(uuid,text,uuid,numeric,boolean,text,text)') is not null)::text,
            (to_regprocedure('public.receive_talvo_supply_item(uuid,uuid,uuid,numeric,text,text,timestamptz,text)') is not null)::text,
            (to_regprocedure('public.get_recipe_usable_stock(uuid,uuid)') is not null)::text,
            (to_regprocedure('public.set_recipe_stock_minimum(uuid,uuid,text,uuid,numeric)') is not null)::text,
            (to_regclass('talvo.branch_stock_minimums') is not null)::text,
            (select count(*) from public.branch where is_active),
            (select count(*) from public.branch),
            (select count(*) from talvo.inventory_locations),
            (select count(*) from talvo.supply_items),
            (select count(*) from talvo.schema_revisions),
            (select count(*) from public.recipe_items where branch_id is null),
            (select count(*) from public.shops),
            (select count(*) from public.branch),
            (select count(*) from public.shop_members),
            (select count(*) from public.recipe_items),
            (select count(*) from public.orders),
            (select count(*) from public.order_items),
            (select count(*) from public.pos_idempotency),
            (select count(*) from public.daily_closes),
            (select count(*) from public.cash_movements);
          SQL
          )"
          expected="true|true|true|true|true|true|true|true|true|$expected_branches|$expected_branches|$expected_locations|0|7|0|$TALVO_EXPECTED_COUNTS"
          [[ "$state" == "$expected" ]] || { echo "::error::Committed production state mismatch: $state"; exit 1; }

          actual="$(docker run --rm -i             -e DATABASE_URL="$PRODUCTION_DATABASE_URL"             -e PGOPTIONS="-c default_transaction_read_only=on"             "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select version,source_sha256 from talvo.schema_revisions order by version;
          SQL
          )"
          expected_revisions="$(sort /tmp/talvo-expected-revisions.txt)"
          [[ "$actual" == "$expected_revisions" ]] || {
            echo "::error::Committed migration checksum ledger mismatch"
            printf 'Expected:
%s
Actual:
%s
' "$expected_revisions" "$actual"
            exit 1
          }
          echo "PASS TALVO production rollout committed and verified"

      - name: Classify production state after any failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TALVO_IDENTITY_VALIDATED:-}" != "true" ]]; then
            echo "Production identity was not validated; no rollout mutation was authorized."
            exit 0
          fi

          base="$(docker run --rm -i \
            -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            -e PGOPTIONS="-c default_transaction_read_only=on" \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select
            (to_regnamespace('talvo') is null)::text,
            (to_regnamespace('talvo') is not null)::text,
            (not exists(select 1 from information_schema.columns where table_schema='public' and table_name='branch' and column_name='is_active'))::text,
            (exists(select 1 from information_schema.columns where table_schema='public' and table_name='branch' and column_name='is_active'))::text,
            (select count(*) from public.branch);
          SQL
          )"
          IFS='|' read -r talvo_absent talvo_present branch_col_absent branch_col_present branch_count <<< "$base"

          if [[ "$talvo_absent|$talvo_present|$branch_col_absent|$branch_col_present" == "true|false|true|false" ]]; then
            echo "PASS failure left production in the original pre-TALVO state"
            exit 0
          fi

          if [[ "$talvo_absent|$talvo_present|$branch_col_absent|$branch_col_present" != "false|true|false|true" ]]; then
            echo "::error::Production is in a partial or unknown schema state: $base"
            exit 1
          fi

          migrated="$(docker run --rm -i \
            -e DATABASE_URL="$PRODUCTION_DATABASE_URL" \
            -e PGOPTIONS="-c default_transaction_read_only=on" \
            "$POSTGRES_17_IMAGE" sh -euc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F "|" ' <<'SQL'
          select
            (select count(*) from public.branch where is_active),
            (select count(*) from public.branch),
            (select count(*) from talvo.inventory_locations),
            (select count(*) from talvo.schema_revisions),
            (select count(*) from talvo.supply_items);
          SQL
          )"
          IFS='|' read -r active_branches total_branches locations revisions supply_items <<< "$migrated"
          if [[ "$active_branches" == "$total_branches" && "$locations" -eq $((total_branches * 2)) && "$revisions" == "7" && "$supply_items" == "0" ]]; then
            echo "PASS production is in the expected fully migrated TALVO state"
            exit 0
          fi
          echo "::error::Production is in a partial or unknown TALVO rollout state: $base | $migrated"
          exit 1
